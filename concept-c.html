<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red River Métis Shoebox — Portrait Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* ============================================================
     THE PORTRAIT WALL — round 2.
     1. Photographs are OBJECTS: a cream mount on every print, cut with
        classic mat proportioning (heavier at the bottom). No glow,
        no drop shadow, no floating.
     2. One alignment system: rows justify edge to edge, type is flush
        to the left margin. No centered symmetry.
     3. Nothing is ever cropped. width = height x the photo's own ratio.
     4. One featured face carries the eye; the others support it.
     5. One motion: a slow light wash crossing a lit wall.
     ============================================================ */
  :root{
    --ink:#e9e1d2;
    --ochre:#b98f4e;        /* old gold, not brass. Exactly two uses */
    --paper:#e6dcc6;
    --quiet:#a89d8a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

  /* A lit wall, not a black void: one static pool of light and a fine tooth.
     The sweep then reads as light crossing a surface rather than a UI ellipse. */
  .wall{position:fixed;inset:0;overflow:hidden;
    background:linear-gradient(180deg,#241b13 0%,#1c1611 46%,#130f0c 100%)}
  .wall::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 42% at 50% -8%, rgba(240,226,192,0.105) 0%, transparent 62%)}
  .wall::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.45;
    background:repeating-linear-gradient(92deg, rgba(255,246,228,0.010) 0 2px, rgba(0,0,0,0.022) 3px 5px)}

  .sweep{position:absolute;left:-40%;top:-30%;width:180%;height:160%;z-index:1;pointer-events:none;
    mix-blend-mode:screen;will-change:transform;
    background:radial-gradient(ellipse 26% 58% at 50% 50%, rgba(255,246,224,0.085) 0%, rgba(255,246,224,0.024) 48%, transparent 74%);
    animation:sweep 74s ease-in-out infinite alternate}
  @keyframes sweep{from{transform:translate3d(-13%,0,0)}to{transform:translate3d(13%,0,0)}}

  /* ---------- prints ---------- */
  .ph{background-repeat:no-repeat;background-position:center;background-size:contain;
    background-clip:padding-box;background-color:#241d17;
    box-shadow:0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.30);
    cursor:pointer;transition:transform .2s ease}
  /* mat proportioning: mats are heavier at the bottom, as a frame shop cuts them */
  .ph.anchor{border-style:solid;border-color:var(--paper);border-width:9px 9px 15px 9px}
  .ph.field {border-style:solid;border-color:var(--paper);border-width:6px 6px 10px 6px}
  /* the featured print is the one the eye is meant to land on */
  .ph.feature{outline:1px solid rgba(185,143,78,0.55);outline-offset:5px}
  .ph:active{transform:scale(0.985)}

  .stage{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:flex-start;
    animation:arrive .5s ease both}
  @keyframes arrive{from{opacity:0}to{opacity:1}}
  .row{display:flex;align-items:flex-end}
  .row.low{align-items:flex-start}

  .anchorbox{display:flex;flex-direction:column;align-items:flex-start}
  /* one label system: name small-caps, then the date in the same voice */
  .cap{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-variant:small-caps;
    color:var(--ink);letter-spacing:0.08em;line-height:1.22;text-align:left;
    font-size:clamp(0.9rem,1.4vw,1.2rem);margin-top:13px}
  .cap .nm{display:block;min-height:3.2em}      /* shared block, never clipped */
  .cap .yr{display:block;font-family:'EB Garamond',Georgia,serif;font-variant:small-caps;
    text-transform:uppercase;font-weight:400;font-size:0.78em;letter-spacing:0.12em;
    color:var(--quiet);margin-top:0.2em}

  /* ---------- type block: flush left on the margin ---------- */
  .brand{position:absolute;top:3.4vh;z-index:5;pointer-events:none;text-align:left}
  .brand .wm{font-family:'Cinzel',Georgia,serif;font-weight:600;text-transform:uppercase;
    font-size:clamp(0.95rem,1.32vw,1.18rem);letter-spacing:0.17em;color:var(--ink);line-height:1}
  .brand .rule{width:clamp(2.6rem,4.4vw,4rem);height:1px;margin-top:0.75rem;
    background:linear-gradient(90deg,rgba(185,143,78,0.9),rgba(185,143,78,0.1))}
  .brand .kicker{margin-top:0.6rem;font-family:'Inter',system-ui,sans-serif;font-weight:300;
    font-size:clamp(0.55rem,0.72vw,0.68rem);letter-spacing:0.24em;text-transform:uppercase;color:#bdb3a0}

  /* ---------- the invitation ---------- */
  .cue{position:absolute;bottom:3.2vh;z-index:5;pointer-events:none;
    display:flex;flex-direction:column;gap:0.5rem}
  .cue .main{display:flex;align-items:center;gap:0.85rem;
    font-family:'Inter',system-ui,sans-serif;font-weight:500;letter-spacing:0.10em;
    text-transform:uppercase;font-size:clamp(1.05rem,1.5vw,1.32rem);color:var(--ochre)}
  .cue .main::before{content:'';width:2px;height:1.05em;background:var(--ochre)}
  .cue .sub{font-family:'EB Garamond',Georgia,serif;font-size:clamp(0.85rem,1.1vw,1rem);
    color:#b8ae9c;letter-spacing:0.01em}
  .cue .sub b{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-style:normal;
    color:var(--paper);font-size:1.22em;letter-spacing:0.02em}
</style>
</head>
<body>
<div class="wall">
  <div class="sweep"></div>
  <header class="brand" id="brand">
    <div class="wm">The Red River Métis Shoebox</div>
    <div class="rule"></div>
    <div class="kicker">Photographs from Métis families and communities</div>
  </header>
  <div class="stage" id="stage">
    <div class="row" id="anchors"></div>
    <div class="row low" id="lowerA"></div>
    <div class="row low" id="lowerB"></div>
  </div>
  <footer class="cue" id="cue">
    <div class="main">Touch a photograph to explore</div>
    <div class="sub"><b>544 photographs</b> from families, communities, and stories</div>
  </footer>
</div>
<script>
/* ============================================================
   A justified grid: each row is sized so its prints, at their own aspect
   ratios, fill the stage width exactly. Both edges land on the margin,
   which is what makes a wall of mixed formats look composed.
   ============================================================ */
const SEED     = 20260911;
const MX_FRAC  = 0.042;
const LOWER_N  = 7;
const ANCHOR_N = 5;
const ANCHOR_IDS = ['photo_958ed6c172',   // Portrait of Germain — Germain Mercredi, 1896
                    'photo_0b88bd158f',   // Marie Madeleine Mercredi Lafferty, 1904
                    'photo_0d22520b08'];  // Gordon Starmer in Military Uniform, 1938
// mats are cut heavier at the bottom
const M = { anchor:{l:9,r:9,t:9,b:15}, field:{l:6,r:6,t:6,b:10} };
const OUT = cls => (M[cls].l + M[cls].r);          // width added by the mount
const OUTV = cls => (M[cls].t + M[cls].b);         // height added by the mount

const thumb = p => encodeURI((p.src||'').replace(/photos\//,'thumbs/').replace(/\.[a-zA-Z0-9]+$/,'.jpg'));
const ratio = p => (p.w && p.h) ? Math.min(Math.max(p.w/p.h, 0.5), 2.1) : 1.4;
const person = p => ((p.people||'').split(';')[0]||'').trim() || (p.title||'');
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const r=mulberry32(seed),a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function loadOk(p){return new Promise(res=>{const i=new Image();
  i.onload=()=>res(true);i.onerror=()=>res(false);i.src=thumb(p)})}

let POOL=null, SEL=null, VW=0;
const anchorsEl=document.getElementById('anchors');
const lowerAEl=document.getElementById('lowerA'), lowerBEl=document.getElementById('lowerB');

function ph(p,h,cls,extra){
  const m=M[cls], w=h*ratio(p), W=w+m.l+m.r, H=h+m.t+m.b;
  return `<div class="ph ${cls}${extra||''}" role="img" aria-label="${esc(p.title)}" title="${esc(p.title)}"
    data-id="${esc(p.id)}" data-aspect="${ratio(p).toFixed(4)}"
    style="width:${W.toFixed(1)}px;height:${H.toFixed(1)}px;background-image:url('${thumb(p)}')"></div>`;
}
// height that makes a row of prints, plus their mounts, fill the available width
function justify(ps, cls, avail, gap){
  const n=ps.length, sumA=ps.reduce((a,p)=>a+ratio(p),0);
  return (avail - n*OUT(cls) - (n-1)*gap) / sumA;
}
// layer prints into rows round-robin by aspect so the rows end up the same height
function partition(ps, rows){
  const order=[...ps].sort((a,b)=>ratio(b)-ratio(a));
  const out=Array.from({length:rows},()=>[]);
  order.forEach((p,i)=>out[i%rows].push(p));
  out.forEach(r=>r.sort((a,b)=>(a.year||0)-(b.year||0)));
  return out;
}

function build(){
  const sel=SEL;
  VW=innerWidth; const vh=innerHeight;
  const mx=Math.max(28, Math.min(VW*MX_FRAC, 74));
  const stageW=VW-2*mx;
  const top=vh*0.152;
  const wallBot=vh*0.845;
  const wallH=wallBot-top;
  const gap=0.0085*VW;

  document.getElementById('brand').style.left=mx+'px';
  const cueEl=document.getElementById('cue');
  cueEl.style.left=mx+'px';

  // caption band: measured, not guessed — name block + date line + the margin
  const capSize=Math.min(1.2*16, Math.max(0.9*16, 0.014*VW));
  const capH=13 + 3.2*capSize + 1.35*capSize;

  const zg=Math.max(16, wallH*0.045);
  const rg=Math.max(10, wallH*0.02);
  const anchors=sel.anchors;

  let aH=Math.min(justify(anchors,'anchor',stageW,gap), vh*0.40);
  let fH=Math.min(justify(sel.rowA,'field',stageW,gap), justify(sel.rowB,'field',stageW,gap));

  // fit counted in real DOM px: print + its mounts + captions + gutters
  const fixed = capH + OUTV('anchor') + 2*OUTV('field') + zg + rg;
  let total = aH + 2*fH + fixed;
  if(total > wallH){
    const s=(wallH - fixed) / (aH + 2*fH);
    if(s>0){ aH*=s; fH*=s; }
  }

  const stage=document.getElementById('stage');
  stage.style.left=mx+'px'; stage.style.top=top+'px';
  stage.style.width=stageW+'px'; stage.style.gap='0px';

  const fillRow=(el,ps,h,cls,maxGapFrac,mb)=>{
    const natural=ps.reduce((a,p)=>a+h*ratio(p)+OUT(cls),0);
    const slots=Math.max(1,ps.length-1);
    const g=Math.max(gap*0.7, Math.min((stageW-natural)/slots, VW*maxGapFrac));
    el.style.gap=g.toFixed(1)+'px';
    el.style.justifyContent='flex-start';
    el.style.marginBottom=mb+'px';
    el.innerHTML=ps.map((p,i)=>{
      // a few prints sit a fraction off true, the way handled prints do.
      const r=(i%3===1)? (mulberry32(SEED+i)().toFixed(3)*0.55-0.275) : 0;
      return ph(p,h,cls, r?` rot` : '')
        .replace('style="','style="transform:rotate('+r.toFixed(3)+'deg);');
    }).join('');
  };

  // the featured face: the middle print of the band, raised above the others
  const fi=Math.floor(anchors.length/2);
  { const m=M.anchor;
    const widths=anchors.map((p,i)=>((i===fi?aH*1.12:aH)*ratio(p))+OUT('anchor'));
    const natural=widths.reduce((a,b)=>a+b,0);
    const slots=Math.max(1,anchors.length-1);
    const g=Math.max(gap*1.5, Math.min((stageW-natural)/slots, VW*0.10));
    anchorsEl.style.gap=g.toFixed(1)+'px';
    anchorsEl.style.justifyContent='flex-start';
    anchorsEl.style.marginBottom=zg+'px';
    anchorsEl.innerHTML=anchors.map((p,i)=>{
      const h=(i===fi? aH*1.12 : aH);
      return `<figure class="anchorbox" style="margin:0;max-width:${(h*ratio(p)+OUT('anchor')).toFixed(0)}px">
        ${ph(p,h,'anchor', i===fi?' feature':'')}
        <figcaption class="cap"><span class="nm">${esc(person(p))}</span>${p.year?`<span class="yr">C. ${esc(p.year)}</span>`:''}</figcaption>
      </figure>`; }).join(''); }

  fillRow(lowerAEl, sel.rowA, fH, 'field', 0.085, rg);
  fillRow(lowerBEl, sel.rowB, fH, 'field', 0.085, 0);

  window.__wallStats={
    total: document.querySelectorAll('.ph').length,
    anchors: anchors.map(p=>person(p)),
    featured: person(anchors[fi]),
    heights:{anchor:Math.round(aH), featured:Math.round(aH*1.12), field:Math.round(fH), cap:Math.round(capH)},
    counts:{anchors:anchors.length, rowA:sel.rowA.length, rowB:sel.rowB.length}
  };
}

fetch('hero-pool.json').then(r=>r.json()).then(async d=>{
  const pool=d.photos||[];
  if(!pool.length) throw new Error('empty pool');

  // palette coherence: one archive, so pre-1945 — a colour frame among the
  // sepia reads as a feed rather than a collection
  const dated = pool.filter(p=>p.year && p.year<=1945);
  const usable = dated.length>=48 ? dated : pool.filter(p=>p.year && p.year<=1965);

  const byId=id=>usable.find(p=>p.id===id);
  let anchors=ANCHOR_IDS.map(byId).filter(Boolean);
  const ok=[]; for(const p of anchors){ if(await loadOk(p)) ok.push(p); }
  if(ok.length<ANCHOR_N){
    const cand=usable.filter(p=>p.h>p.w && p.faceX!=null && p.faceY!=null
      && p.year && person(p) && !ok.includes(p) && (p.year||0)<=1960);
    for(const p of shuffle(cand,SEED)){ if(ok.length>=ANCHOR_N) break; if(await loadOk(p)) ok.push(p); }
  }
  anchors=ok.slice(0,ANCHOR_N);

  const rest=shuffle(usable.filter(p=>!anchors.includes(p)), SEED);
  const picked=[];
  for(const p of rest){ if(picked.length>=2*LOWER_N) break; if(await loadOk(p)) picked.push(p); }
  const rows=partition(picked,2);

  SEL={ anchors, rowA: rows[0], rowB: rows[1] };
  POOL=usable; build();
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150);});
}).catch(()=>{
  anchorsEl.innerHTML='<div class="cap" style="max-width:60vw">Photographs could not be loaded — please check the server.</div>';
});
</script>
</body>
</html>
