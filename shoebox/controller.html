<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Métis Kin — Exhibit Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load async (media=print trick): a render-blocking stylesheet to
       an unreachable host blanks the kiosk for ~15s on networks without
       internet. With this, the page paints with system fonts immediately and
       upgrades to Cinzel/EB Garamond/Inter when (if) they arrive. -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --black: #0a0a0a;
      --near-black: #111;
      --charcoal: #1a1814;
      --crimson: #8b0000;
      --crimson-glow: #6b0000;
      --warm-gray: #6b655e;
      --light-warm: #cfc8be;
      --cream: #e8e2d6;
      --accent-warm: #bfa885;
      --gold: #c4933a;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-kicker: 'Cinzel', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--black);
      color: var(--cream);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    input, textarea { user-select: text; -webkit-user-select: text; }

    /* ─── Ambient crimson glow ─── */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 120% 50% at 50% 100%, rgba(139,0,0,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .hidden { display: none !important; }

    /* ─── Screensaver: The Scanning Table ───
       Archival prints laid flat on a warm charcoal surface, each sized to its
       OWN aspect ratio (no crop, no uniform cells), slight rotation, soft
       shadows, edge-overlap for density. One layer drifts slowly; a fresh
       table crossfades in every ~90s. Wordmark top-center with scrim. */
    #attractCollage {
      position: fixed; inset: 0; z-index: 2;
      overflow: hidden; pointer-events: none;
      opacity: 0; transition: opacity 0.8s ease;
      /* the scanning surface: a real tabletop with a warm light from above,
         a soft wood/paper grain, and a vignette so prints sit ON something */
      background:
        radial-gradient(ellipse 120% 70% at 50% -10%, rgba(120,95,70,0.35) 0%, transparent 45%),
        radial-gradient(ellipse 130% 90% at 50% 115%, rgba(0,0,0,0.6) 0%, transparent 55%),
        repeating-linear-gradient(92deg, rgba(255,240,220,0.016) 0px, rgba(255,240,220,0.016) 2px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 5px),
        linear-gradient(180deg, #241d17 0%, #1a1410 45%, #0f0b08 100%);
    }
    #attractCollage.show { opacity: 1; }
    /* while the screensaver is up, blank out the Now Showing photo behind it */
    #app.attract .now-showing { background-color: var(--black); }
    #app.attract .slide-layer { opacity: 0 !important; }

    .table-scene {
      position: absolute; inset: 0;
      will-change: transform;
      animation: tableDrift 80s ease-in-out infinite alternate;
    }
    @keyframes tableDrift {
      from { transform: scale(1.0) translate(0, 0); }
      to   { transform: scale(1.06) translate(-1.2%, 1.2%); }
    }
    .print {
      position: absolute;
      width: var(--w); height: var(--h);
      left: var(--x); top: var(--y);
      transform: rotate(var(--rot, 0deg));
      /* each print is contain at its own aspect: complete photo, no crop */
      background-size: contain; background-repeat: no-repeat;
      background-position: center;
      /* consistent top-light: soft cast down + a tighter contact shadow */
      box-shadow: 0 14px 34px rgba(0,0,0,0.55), 0 3px 8px rgba(0,0,0,0.5);
      background-color: #1a1613;
    }
    .print .print-cap {
      position: absolute; left: 0; right: 0; bottom: -1.6em;
      font-family: var(--font-serif); font-style: italic;
      font-size: clamp(0.7rem, 1.4vw, 1rem);
      color: rgba(232,226,214,0.82);
      text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .attract-brand {
      position: absolute; left: 50%; top: 6%; transform: translateX(-50%);
      font-family: var(--font-kicker); font-weight: 700;
      /* Fixed size that FITS any tablet: 1280px wide max. Measured C1 fix:
         the old clamp + 0.18em tracking overflowed to 1922px and clipped
         "BOX". Now sized to fit within the viewport at every size. */
      font-size: clamp(1.6rem, 4.2vw, 3.4rem);
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--cream); z-index: 3; text-align: center;
      line-height: 1.15;
      white-space: nowrap;
      /* subtle dark scrim so the hero text reads over ANY photo */
      padding: 0.3em 1em;
      background: radial-gradient(ellipse 75% 130% at 50% 50%, rgba(10,10,10,0.66) 0%, rgba(10,10,10,0.38) 60%, transparent 100%);
      border-radius: 0.4em;
      /* one static soft shadow — no breathing animation (museum-calm) */
      text-shadow: 0 2px 14px rgba(0,0,0,0.85);
    }

    /* ─── Layout ─── */
    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100%; width: 100%;
      padding: 0.75rem 0.9rem 0.6rem;
      gap: 0.45rem;
    }

    /* Chrome fades away in attract (screensaver) mode */
    .chrome { transition: opacity 0.6s ease; }
    #app.attract .chrome { opacity: 0; pointer-events: none; }
    #app.attract .nav-arrow { opacity: 0; pointer-events: none; }

    /* ─── Top bar: search + status ─── */
    .top-bar {
      display: flex; align-items: center; gap: 0.6rem;
      flex-shrink: 0;
    }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap input {
      width: 100%;
      min-height: 48px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 0.6rem 0.8rem 0.6rem 2.4rem;
      font-family: var(--font-kicker); font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--cream); outline: none;
      transition: border-color 0.3s, background 0.3s;
    }
    .search-wrap input::placeholder { color: var(--warm-gray); }
    .search-wrap input:focus {
      border-color: var(--crimson);
      background: rgba(139,0,0,0.06);
    }
    .search-wrap .search-icon {
      position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
      color: var(--warm-gray); font-size: 0.8rem; pointer-events: none;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4);
      transition: background 0.3s;
    }
    .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.4); }

    /* ─── Beadwork divider ─── */
    .beadwork {
      height: 4px; flex-shrink: 0;
      background: repeating-linear-gradient(
        90deg,
        var(--crimson) 0px, var(--crimson) 3px,
        transparent 3px, transparent 6px,
        var(--gold) 6px, var(--gold) 9px,
        transparent 9px, transparent 12px
      );
      opacity: 0.3;
    }

    /* ─── Timeline scroller ─── */
    .timeline {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 0.4rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 0.1rem 0;
      scrollbar-width: none;
    }
    .timeline::-webkit-scrollbar { display: none; }
    .tl-label {
      flex-shrink: 0;
      font-family: var(--font-kicker); font-size: 0.5rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--warm-gray);
    }
    .tl-chip {
      flex-shrink: 0;
      min-height: 40px; padding: 0 0.9rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--light-warm);
      font-family: var(--font-kicker); font-size: 0.6rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .tl-chip.active { background: var(--crimson); border-color: var(--crimson); color: var(--cream); }
    /* keep the decade suffix lowercase: '1850s', not '1850S' */
    .tl-chip .tl-s { text-transform: lowercase; letter-spacing: 0; }

    /* ─── Now Showing panel ─── */
    .now-showing {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px; overflow: hidden;
      position: relative;
      user-select: none; -webkit-user-select: none;
    }
    .now-showing .photo-area {
      flex: 1; min-height: 0;
      background-color: var(--near-black);
      position: relative;
      overflow: hidden;
    }
    .slide-layer {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1s ease;
      will-change: opacity;
    }
    .slide-layer.on { opacity: 1; }
    .now-showing .photo-area .tap-hint {
      position: absolute; bottom: 0.6rem; right: 0.6rem;
      font-family: var(--font-kicker); font-size: 0.45rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--warm-gray); background: rgba(0,0,0,0.5);
      padding: 0.25rem 0.55rem; border-radius: 4px;
      pointer-events: none;
    }
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(10,10,10,0.55); border: 1px solid rgba(255,255,255,0.16);
      color: var(--cream); font-size: 1.15rem; line-height: 1;
      cursor: pointer; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: opacity 0.4s, background 0.15s;
    }
    .nav-arrow.prev { left: 0.6rem; }
    .nav-arrow.next { right: 0.6rem; }
    .now-showing .details {
      flex-shrink: 0;
      padding: 1rem 1.2rem 1.4rem;
      background: linear-gradient(transparent 20%, rgba(10,10,10,0.88) 40%, rgba(10,10,10,0.95));
    }
    .now-showing .details .title {
      font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700;
      color: var(--cream); line-height: 1.25;
    }
    .now-showing .details .meta {
      font-family: var(--font-sans); font-size: 0.85rem;
      color: var(--light-warm); margin-top: 0.3rem;
    }
    .now-showing .details .desc {
      font-family: var(--font-sans); font-size: 0.85rem;
      color: var(--warm-gray); margin-top: 0.3rem;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.4;
    }
    .details-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .listen-btn, .related-btn {
      display: inline-block;
      background: rgba(139,0,0,0.3); border: 1px solid var(--crimson);
      color: var(--cream); font-family: var(--font-kicker);
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0.45rem 0.8rem; border-radius: 6px; cursor: pointer;
      min-height: 40px;
    }
    .related-btn { background: rgba(196,147,58,0.15); border-color: var(--gold); }

    /* ─── Story Piles row ─── */
    .piles-row {
      flex-shrink: 0;
      display: flex; gap: 0.5rem;
    }
    .pile {
      flex: 1;
      height: 68px; border-radius: 10px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .pile .pile-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: brightness(0.35) saturate(0.8);
      transition: filter 0.3s;
    }
    .pile .pile-label {
      position: relative; z-index: 1;
      font-family: var(--font-serif); font-size: 0.75rem; font-style: italic; font-weight: 700;
      color: var(--cream); text-shadow: 0 1px 8px rgba(0,0,0,0.8);
      text-align: center; line-height: 1.1;
    }
    .pile .pile-sub {
      position: relative; z-index: 1;
      font-family: var(--font-sans); font-size: 0.48rem;
      color: var(--light-warm); margin-top: 0.15rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .pile-0 { box-shadow: inset 0 0 30px rgba(196,147,58,0.15); }
    .pile-1 { box-shadow: inset 0 0 30px rgba(139,0,0,0.15); }
    .pile-2 { box-shadow: inset 0 0 30px rgba(191,168,133,0.1); }

    /* ─── Gallery strip ─── */
    .gallery {
      flex-shrink: 0;
      display: flex; gap: 0.45rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 0.2rem 0.1rem 0.3rem;
      scrollbar-width: none;
      min-height: 74px;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .gal-item {
      flex-shrink: 0; width: 62px; height: 62px;
      border-radius: 8px; background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; position: relative;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .gal-item.active { border-color: var(--crimson); box-shadow: 0 0 12px rgba(139,0,0,0.6); transform: scale(1.06); }

    /* ─── Controls bar ─── */
    .controls-bar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 0.4rem;
      flex-wrap: wrap;
      padding: 0.35rem 0.5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06);
      color: var(--cream); padding: 0.35rem 0.6rem; border-radius: 8px;
      font-size: 0.62rem; cursor: pointer; white-space: nowrap;
      font-family: var(--font-sans); letter-spacing: 0.04em;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
      min-height: 44px;
    }
    .ctrl-btn.active { background: var(--crimson); border-color: var(--crimson); color: var(--cream); }
    .ctrl-group-label {
      font-family: var(--font-kicker); font-size: 0.45rem;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--warm-gray); margin-right: 0.1rem;
    }
    .ctrl-spacer { flex: 1; }
    .count-label {
      font-family: var(--font-sans); font-size: 0.55rem;
      color: var(--warm-gray); white-space: nowrap;
    }

    /* ─── Tactile press feedback ─── */
    button:active, .pile:active, .tl-chip:active, .sr-item:active,
    .gal-item:active, .related-card:active, .nav-arrow:active {
      filter: brightness(1.25);
      box-shadow: 0 0 16px rgba(139,0,0,0.6);
    }
    .pile:active, .gal-item:active, .related-item:active, .nav-arrow:active { transform: scale(0.95); }
    .tl-chip:active { transform: scale(0.95); }

    /* ─── Search results overlay ─── */
    #searchResults {
      position: absolute; z-index: 20;
      top: 100%; left: 0; right: 0; margin-top: 0.25rem;
      background: rgba(10,10,10,0.97); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; max-height: 320px; overflow-y: auto;
      display: none; backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #searchResults.open { display: block; }
    #searchResults .sr-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.45rem 0.7rem; cursor: pointer;
      min-height: 52px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s;
    }
    #searchResults .sr-item:last-child { border-bottom: none; }
    #searchResults .sr-thumb {
      width: 40px; height: 40px; border-radius: 6px;
      background-size: cover; background-position: center;
      flex-shrink: 0;
    }
    #searchResults .sr-name {
      font-family: var(--font-serif); font-size: 0.8rem; font-style: italic;
      color: var(--cream);
    }
    #searchResults .sr-meta { font-size: 0.58rem; color: var(--warm-gray); }
    #searchResults .sr-empty {
      padding: 0.9rem 1rem;
      font-size: 0.7rem; color: var(--warm-gray); font-style: italic;
      line-height: 1.5;
    }
    #searchResults .sr-more {
      padding: 0.5rem 0.7rem; font-size: 0.58rem; color: var(--warm-gray);
      text-align: center; font-family: var(--font-kicker); letter-spacing: 0.08em;
    }

    /* ─── Detail overlay ─── */
    #detailOverlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(10,10,10,0.97); backdrop-filter: blur(20px);
      display: none; flex-direction: column;
      padding: 1.25rem;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    #detailOverlay.open { display: flex; }
    #detailOverlay .detail-close {
      align-self: flex-end;
      background: rgba(10,10,10,0.6); border: 1px solid rgba(255,255,255,0.18);
      color: var(--cream); padding: 0.55rem 1.2rem; border-radius: 10px;
      font-family: var(--font-kicker); font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer; margin-bottom: 0.7rem;
      min-height: 48px; min-width: 96px;
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
    }
    .detail-close .close-x { font-size: 1rem; line-height: 1; }
    /* Tap anywhere on the dark backdrop to dismiss — the close button is
       backup, the whole overlay is the target. */
    #detailOverlay .detail-close:active { background: rgba(139,0,0,0.5); }
    #detailOverlay .detail-photo {
      flex: 1; min-height: 42vh;
      background-size: contain; background-repeat: no-repeat;
      background-position: center; background-color: var(--black);
      border-radius: 8px;
    }
    #detailOverlay .detail-info {
      flex-shrink: 0; padding: 1rem 0 1.5rem;
    }
    #detailOverlay .detail-title {
      font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; line-height: 1.25;
    }
    #detailOverlay .detail-meta {
      font-family: var(--font-sans); font-size: 0.9rem;
      color: var(--light-warm); margin-top: 0.3rem;
    }
    #detailOverlay .detail-desc {
      font-family: var(--font-sans); font-size: 0.9rem;
      color: var(--warm-gray); margin-top: 0.5rem; line-height: 1.5;
    }
    .related-section { margin-top: 1rem; }
    .related-label {
      font-family: var(--font-kicker); font-size: 0.55rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--warm-gray); margin-bottom: 0.45rem;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
      padding-bottom: 0.5rem;
    }
    .related-card {
      border-radius: 10px; overflow: hidden;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .related-card .rc-photo {
      width: 100%; aspect-ratio: 4 / 3;
      background-size: cover; background-position: center;
    }
    .related-card .rc-badge {
      position: absolute; top: 0.4rem; left: 0.4rem; z-index: 2;
      background: rgba(10,10,10,0.82); border: 1px solid var(--gold);
      color: var(--gold); font-family: var(--font-kicker);
      font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.22rem 0.5rem; border-radius: 999px;
      pointer-events: none; backdrop-filter: blur(4px);
    }
    .related-card .rc-photo-wrap { position: relative; }
    .related-card .rc-info {
      padding: 0.45rem 0.55rem 0.55rem;
    }
    .related-card .rc-title {
      font-family: var(--font-serif); font-size: 0.78rem; font-style: italic;
      color: var(--cream); line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .related-card .rc-meta {
      font-family: var(--font-sans); font-size: 0.58rem;
      color: var(--warm-gray); margin-top: 0.2rem;
    }
    .related-count { font-size: 0.55rem; color: var(--warm-gray); margin-left: 0.4rem; }
  </style>
</head>
<body>
  <div id="attractCollage"><div class="attract-brand">The Red River Métis Shoebox</div></div>

  <div id="app">
    <!-- Top bar -->
    <div class="top-bar chrome">
      <div class="search-wrap">
        <span class="search-icon">&#x1F50D;</span>
        <input type="search" id="searchInput" placeholder="FIND A NAME · Lafferty · Chartrand · Mercredi · Anderson···" autocomplete="off" />
        <div id="searchResults"></div>
      </div>
      <div class="status-dot" id="statusDot"></div>
    </div>

    <!-- Timeline scroller -->
    <div class="timeline chrome" id="timelineBar"></div>

    <div class="beadwork chrome"></div>

    <!-- Now Showing -->
    <div class="now-showing" id="nowShowing">
      <div class="photo-area" id="photoArea">
        <div class="slide-layer" id="slideA"></div>
        <div class="slide-layer" id="slideB"></div>
        <button class="nav-arrow prev" id="btnPrev" aria-label="Previous photo">&#8249;</button>
        <button class="nav-arrow next" id="btnNext" aria-label="Next photo">&#8250;</button>
        <div class="tap-hint hidden" id="tapHint">tap for details</div>
      </div>
      <div class="details hidden" id="details">
        <div class="title" id="detailTitle"></div>
        <div class="meta" id="detailMeta"></div>
        <div class="desc" id="detailDesc"></div>
        <div class="details-actions">
          <button class="related-btn" id="btnRelated">Related &#9654;</button>
          <button class="listen-btn" id="listenBtn" style="display:none;">&#x1F50A; Listen</button>
        </div>
      </div>
    </div>

    <!-- Story Piles -->
    <div class="piles-row chrome" id="pilesRow"></div>

    <!-- Thumbnail gallery -->
    <div class="gallery chrome" id="gallery"></div>

    <div class="beadwork chrome"></div>

    <!-- Controls -->
    <div class="controls-bar chrome">
      <span class="ctrl-group-label">Play</span>
      <button class="ctrl-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <span class="ctrl-group-label">Speed</span>
      <button class="ctrl-btn" data-speed="3000" onclick="setSpeed(3000)">3s</button>
      <button class="ctrl-btn active" data-speed="5000" onclick="setSpeed(5000)">5s</button>
      <button class="ctrl-btn" data-speed="7000" onclick="setSpeed(7000)">7s</button>
      <button class="ctrl-btn" data-speed="10000" onclick="setSpeed(10000)">10s</button>
      <button class="ctrl-btn" data-speed="15000" onclick="setSpeed(15000)">15s</button>
      <span class="ctrl-group-label">Tr</span>
      <button class="ctrl-btn" data-trans="kenburns" onclick="setTransition('kenburns')">Ken</button>
      <button class="ctrl-btn" data-trans="fade" onclick="setTransition('fade')">Fade</button>
      <button class="ctrl-btn" data-trans="slide" onclick="setTransition('slide')">Slide</button>
      <span class="ctrl-group-label">Opt</span>
      <button class="ctrl-btn" id="btnCaption" onclick="cycleCaptions()">Captions</button>
      <button class="ctrl-btn" id="btnShuffle" onclick="toggleShuffle()">Shuffle</button>
      <button class="ctrl-btn" id="btnFace" onclick="toggleFace()">Face</button>
      <button class="ctrl-btn" id="btnZoom" onclick="cycleZoom()">Zoom: Std</button>
      <div class="ctrl-spacer"></div>
      <span class="count-label" id="countLabel">376 photos</span>
    </div>
  </div>

  <!-- Detail overlay: tap the dark backdrop OR swipe down to dismiss -->
  <div id="detailOverlay">
    <button class="detail-close" onclick="closeDetail()"><span class="close-x">&#10005;</span> Close</button>
    <div class="detail-photo" id="detailPhoto"></div>
    <div class="detail-info">
      <div class="detail-title" id="detailOverlayTitle"></div>
      <div class="detail-meta" id="detailOverlayMeta"></div>
      <div class="detail-desc" id="detailOverlayDesc"></div>
      <button class="listen-btn" id="detailListenBtn" style="display:none; margin-top:0.5rem;">&#x1F50A; Listen to story</button>
      <div class="related-section hidden" id="relatedSection">
        <div class="related-label">Related photos <span class="related-count" id="relatedCount"></span></div>
        <div class="related-grid" id="relatedStrip"></div>
      </div>
    </div>
  </div>

  <script>
  // ─── State ───
  const APP_VERSION = 'v3.3.0';
  let serverUrl = 'http://localhost:8081';
  let photos = [];
  const byId = {};
  let currentPhoto = null;
  let currentIndex = 0;
  let serverIds = [];
  let speedMs = 5000;
  let transition = 'kenburns';
  let captionMode = 0;
  let shuffle = false;
  let faceTrack = false;
  let playing = true;
  let kbZoom = 1.15;
  const ZOOM_PRESETS = [[1.05, 'Sub'], [1.15, 'Std'], [1.30, 'Dram']];
  let zoomPresetIdx = 1;
  let themes = [];
  let isAttract = true;
  let isDetailOpen = false;
  let idleTimer = null;
  let searchTimer = null;
  let nameCycleTimer = null;
  let pollTimer = null;
  let attractInterval = null;
  let lastGalleryKey = '';
  let swiped = false;
  let lastStateTime = Date.now();
  let lastUserActivity = 0;
  const nameCycleList = ['Lafferty', 'Chartrand', 'Mercredi', 'Anderson', 'Cousineau', 'Dejarlais', 'Starmer', 'Nault', 'Monkman', 'Parisian', 'Flett', 'Boucher', 'Cook', 'Carney', 'Mercredi'];
  let nameCycleIdx = 0;

  // ─── Helpers ───
  function base() {
    return window.location.pathname.includes('/shoebox-v2/') ? '/shoebox-v2/' : '/';
  }
  function encodePath(path) {
    if (!path) return '';
    return path.split('/').map(s => encodeURIComponent(s)).join('/');
  }
  function thumbUrl(p) {
    if (!p || !p.src) return '';
    return encodePath(p.src.replace(/photos\//, 'thumbs/').replace(/\.[a-zA-Z0-9]+$/, '.jpg'));
  }
  function fullUrl(p) {
    return p && p.src ? `${base()}${encodePath(p.src)}` : '';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function buzz() {
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
  }
  // Paint a thumb instantly, then upgrade to the full-res image when loaded
  function setBgUpgrade(el, p, unguarded) {
    const t = thumbUrl(p);
    if (t) el.style.backgroundImage = `url(${t})`;
    const full = fullUrl(p);
    if (full) {
      const img = new Image();
      img.onload = () => {
        if (unguarded || fullUrl(currentPhoto) === full) el.style.backgroundImage = `url(${full})`;
      };
      img.src = full;
    }
  }

  // ─── Server communication ───
  function getServerUrl() {
    const param = new URLSearchParams(window.location.search).get('server');
    if (param) return `http://${param}`;
    const host = window.location.hostname;
    if (host && host !== 'localhost' && host !== '127.0.0.1' && host !== '') {
      return `http://${host}:8081`;
    }
    return 'http://localhost:8081';
  }

  async function postState(updates) {
    buzz();
    // One retry: a dropped tap should not silently vanish on the big screen
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        await fetch(`${serverUrl}/state`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
          signal: AbortSignal.timeout(4000)
        });
        return;
      } catch (e) { /* retry once */ }
    }
  }

  async function fetchState() {
    try {
      const res = await fetch(`${serverUrl}/state`, { signal: AbortSignal.timeout(2500) });
      if (!res.ok) throw new Error();
      const data = await res.json();
      lastStateTime = Date.now();
      serverIds = data.photoIds || [];
      currentIndex = data.currentIndex || 0;
      currentPhoto = data.currentPhoto;
      syncControls(data);
      document.getElementById('statusDot').classList.remove('disconnected');
      updateNowShowing();
      updateCount();
      updateGallery();
    } catch (e) {
      document.getElementById('statusDot').classList.add('disconnected');
    }
  }

  function startPolling() {
    pollTimer = setInterval(fetchState, 1500);
  }

  function syncControls(d) {
    if (d.speed != null && d.speed !== speedMs) {
      speedMs = d.speed;
      document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('active', +b.dataset.speed === d.speed));
    }
    if (d.transition && d.transition !== transition) {
      transition = d.transition;
      document.querySelectorAll('[data-trans]').forEach(b => b.classList.toggle('active', b.dataset.trans === d.transition));
    }
    if (d.captionMode != null && d.captionMode !== captionMode) {
      captionMode = d.captionMode;
      document.getElementById('btnCaption').classList.toggle('active', d.captionMode > 0);
    }
    if (d.shuffle != null && d.shuffle !== shuffle) {
      shuffle = d.shuffle;
      document.getElementById('btnShuffle').classList.toggle('active', d.shuffle);
    }
    if (d.faceTrack != null && d.faceTrack !== faceTrack) {
      faceTrack = d.faceTrack;
      document.getElementById('btnFace').classList.toggle('active', d.faceTrack);
    }
    if (d.playing != null && d.playing !== playing) {
      playing = d.playing;
      document.getElementById('btnPlay').textContent = d.playing ? '⏸' : '▶';
    }
    if (d.kbZoom != null && d.kbZoom !== kbZoom) {
      kbZoom = d.kbZoom;
      const i = ZOOM_PRESETS.findIndex(p => p[0] === kbZoom);
      if (i >= 0) zoomPresetIdx = i;
      updateZoomLabel();
    }
  }

  function updateZoomLabel() {
    const match = ZOOM_PRESETS.find(p => p[0] === kbZoom);
    document.getElementById('btnZoom').textContent = match ? `Zoom: ${match[1]}` : `Zoom: ${kbZoom.toFixed(2)}x`;
  }

  function cycleZoom() {
    zoomPresetIdx = (zoomPresetIdx + 1) % ZOOM_PRESETS.length;
    kbZoom = ZOOM_PRESETS[zoomPresetIdx][0];
    updateZoomLabel();
    postState({ kbZoom });
  }

  // ─── Idle / Attract mode ───
  // After IDLE_RESET_MS of no interaction, drop back to the default exhibit
  // state, then enter the screensaver. Any interaction restarts the window.
  const IDLE_RESET_MS = 120000;
  function startIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(returnToDefault, IDLE_RESET_MS);
  }
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(returnToDefault, IDLE_RESET_MS);
  }
  function returnToDefault() {
    // (a) Clear the search input and stop its placeholder name-cycling
    const input = document.getElementById('searchInput');
    if (input) {
      input.value = '';
      input.blur();
      input.placeholder = 'FIND A NAME · Lafferty · Chartrand · Mercredi · Anderson···';
    }
    if (nameCycleTimer) { clearInterval(nameCycleTimer); nameCycleTimer = null; }
    nameCycleIdx = 0;
    // (b) Clear active era/filter chips and close the detail panel
    clearTimelineActive();
    const results = document.getElementById('searchResults');
    if (results) results.classList.remove('open');
    isDetailOpen = false;
    const overlay = document.getElementById('detailOverlay');
    if (overlay) overlay.classList.remove('open');
    // (c) Post the clean default state so the projector follows back to the
    // default hero carousel
    postState({ filters: {}, currentIndex: 0, shuffle: true, playing: true, transition: 'kenburns', speed: 5000, captionMode: 2, faceTrack: false });
    // (d) Then go to attract
    enterAttract();
  }
  function enterAttract() {
    if (isDetailOpen) return;
    isAttract = true;
    document.getElementById('app').classList.add('attract');
    document.getElementById('attractCollage').classList.add('show');
    document.getElementById('details').classList.add('hidden');
    startCollage();
  }
  function wakeFromAttract() {
    resetIdle();
    if (!isAttract) return;
    isAttract = false;
    stopCollage();
    document.getElementById('app').classList.remove('attract');
    document.getElementById('attractCollage').classList.remove('show');
    document.getElementById('tapHint') && document.getElementById('tapHint').classList.remove('hidden');
    document.getElementById('details').classList.remove('hidden');
    if (currentPhoto) updateNowShowing();
  }

  // ─── Screensaver: The Scanning Table ───
  let collageTimer = null;
  let collageBuilt = false;
  let collageRebuildTimer = null;
  // Only pre-1950 archival photos belong in the screensaver (modern 2020s
  // colour shots look wrong beside 1890s sepia portraits). Falls back to all
  // photos if nothing carries a year.
  function collagePool() {
    const pre1950 = photos.filter(p => p.year != null && p.year < 1950);
    return pre1950.length ? pre1950 : photos;
  }
  // Shuffle-deal without replacement so no duplicate prints ever appear.
  function shuffledPool() {
    const pool = collagePool().slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool;
  }
  function printCaption(p) {
    // name · community · year, or the caption when it's the only story
    const people = (p.people || '').split(';').map(s => s.trim()).filter(Boolean).slice(0, 2).join(', ');
    const place = p.community || '';
    const year = p.year ? (p.year < 2000 ? 'c.' + p.year : '' + p.year) : '';
    const seg = [people, place, year].filter(Boolean);
    if (seg.length >= 2) return seg.join(' · ');
    if (p.caption) return p.caption;
    return seg[0] || '';
  }
  function buildCollage() {
    const c = document.getElementById('attractCollage');
    const brand = c.querySelector('.attract-brand');
    c.innerHTML = '';
    // No photos yet (relay/manifest down): keep the wordmark and stop — a
    // throw here would kill init and leave a permanent black screen.
    if (!photos.length) { if (brand) c.appendChild(brand); return; }

    const pool = shuffledPool();
    const scene = document.createElement('div');
    scene.className = 'table-scene';

    // ~20-22 prints, each sized to its OWN aspect ratio (no uniform cells),
    // laid flat with rotation, DENSE overlap (photos partially covering each
    // other, like a real shoebox spill — not a grid), consistent shadow
    // direction from a single top-light.
    const count = 21;
    const vw = window.innerWidth, vh = window.innerHeight;
    // Anchor points scattered across the whole surface; prints drawn in order
    // so later ones overlap earlier ones naturally.
    const cols = 4, rows = 5;
    const cellW = vw / cols, cellH = vh / rows;
    for (let i = 0; i < count; i++) {
      const p = pool[i % pool.length];
      const pa = (p.width && p.height) ? p.height / p.width : 1;
      const aspect = Math.min(Math.max(pa, 0.4), 2.4);
      // size LARGER than the cell so neighbors overlap (density)
      let w = cellW * (0.78 + Math.random() * 0.28);
      let h = w * aspect;
      if (h > cellH * 1.12) { h = cellH * 1.12; w = h / aspect; }
      // position at the cell center with bigger jitter so edges overlap;
      // first row starts below the wordmark's safe zone (top ~12vh)
      const cx = (i % cols) * cellW + (cellW - w) / 2 + (Math.random() * 0.5 - 0.25) * cellW;
      const rowY = Math.floor(i / cols);
      const cy = (rowY === 0 ? vh * 0.12 : rowY * cellH) + (cellH - h) / 2 + (Math.random() * 0.5 - 0.25) * cellH;
      // varied rotation, some straight (museum flat-lay feel)
      const rot = (Math.random() < 0.3 ? 0 : (Math.random() * 7 - 3.5)).toFixed(1);
      const el = document.createElement('div');
      el.className = 'print';
      el.style.setProperty('--w', w.toFixed(1) + 'px');
      el.style.setProperty('--h', h.toFixed(1) + 'px');
      el.style.setProperty('--x', cx.toFixed(1) + 'px');
      el.style.setProperty('--y', cy.toFixed(1) + 'px');
      el.style.setProperty('--rot', rot + 'deg');
      el.style.backgroundImage = `url(${thumbUrl(p)})`;
      // captions on a subset (only where there's a story to tell), drawn
      // AFTER the print so they sit on top and stay readable
      if (i % 3 === 0) {
        const cap = printCaption(p);
        if (cap) {
          const capEl = document.createElement('div');
          capEl.className = 'print-cap';
          capEl.textContent = cap;
          el.appendChild(capEl);
        }
      }
      scene.appendChild(el);
    }
    c.appendChild(scene);
    c.appendChild(brand);
  }
  // Rebuild the table with fresh photos + arrangement on every idle session
  // (or ~90s), crossfading over the existing 0.8s opacity transition so there
  // is never a mid-flight swap.
  function collageRefresh() {
    if (!isAttract || !photos.length) return;
    const c = document.getElementById('attractCollage');
    // fade out, rebuild, fade back in — one clean crossfade
    c.style.transition = 'opacity 0.8s ease';
    c.style.opacity = '0';
    setTimeout(() => {
      buildCollage();
      c.style.opacity = '1';
    }, 800);
  }
  function startCollage() {
    buildCollage();
    // rotate the table every ~90s while idle
    if (!collageRebuildTimer) collageRebuildTimer = setInterval(collageRefresh, 90000);
  }
  function stopCollage() {
    if (collageRebuildTimer) { clearInterval(collageRebuildTimer); collageRebuildTimer = null; }
  }

  // ─── Name cycling in search ───
  function startNameCycle() {
    const input = document.getElementById('searchInput');
    if (nameCycleTimer) clearInterval(nameCycleTimer);
    nameCycleTimer = setInterval(() => {
      if (document.activeElement === input) return;
      if (input.value) return;
      const name = nameCycleList[nameCycleIdx % nameCycleList.length];
      nameCycleIdx++;
      input.placeholder = `FIND A NAME · ${name}···`;
    }, 3000);
  }

  // ─── Search ───
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    const q = this.value.trim();
    if (!q) {
      document.getElementById('searchResults').classList.remove('open');
      return;
    }
    searchTimer = setTimeout(() => doSearch(q), 200);
  });

  document.addEventListener('click', function(e) {
    const results = document.getElementById('searchResults');
    if (!e.target.closest('.search-wrap')) results.classList.remove('open');
  });

  async function doSearch(q) {
    try {
      const res = await fetch(`${serverUrl}/search?q=${encodeURIComponent(q)}`, { signal: AbortSignal.timeout(2500) });
      const data = await res.json();
      renderSearchResults(data.results || [], q);
    } catch (e) {}
  }

  function renderSearchResults(results, q) {
    const container = document.getElementById('searchResults');
    if (!results.length) {
      container.innerHTML = `<div class="sr-empty">No matches for "${esc(q)}". Try a family name, a community, or a keyword.</div>`;
      container.classList.add('open');
      return;
    }
    container.innerHTML = results.slice(0, 20).map(p => {
      const name = p.people || p.title || 'Unknown';
      const year = p.year ? `c.${p.year}` : '';
      const community = p.community || '';
      return `<div class="sr-item" onclick="selectSearchResult('${p.id}')">
        <div class="sr-thumb" style="background-image:url('${thumbUrl(p)}')"></div>
        <div>
          <div class="sr-name">${esc(name)}</div>
          <div class="sr-meta">${[year, community].filter(Boolean).join(' · ')}</div>
        </div>
      </div>`;
    }).join('') + (results.length > 20 ? `<div class="sr-more">+${results.length - 20} more matches</div>` : '');
    container.classList.add('open');
  }

  function selectSearchResult(photoId) {
    const p = byId[photoId];
    if (p) {
      const names = (p.people || '').split(';').map(s => s.trim()).filter(Boolean);
      if (names.length) {
        postState({ filters: { people: [names[0]] } });
      } else {
        postState({ filters: { id: [photoId] } });
      }
    } else {
      postState({ filters: { id: [photoId] } });
    }
    clearTimelineActive();
    document.getElementById('searchResults').classList.remove('open');
    document.getElementById('searchInput').value = '';
    document.getElementById('searchInput').blur();
    wakeFromAttract();
  }

  // ─── Timeline scroller ───
  function buildTimeline() {
    const decades = new Set();
    photos.forEach(p => { if (p.year) decades.add(Math.floor(p.year / 10) * 10); });
    const sorted = [...decades].sort((a, b) => a - b);
    const bar = document.getElementById('timelineBar');
    bar.innerHTML = `<span class="tl-label">Era</span>` +
      `<button class="tl-chip active" data-decade="">All</button>` +
      sorted.map(d => `<button class="tl-chip" data-decade="${d}">${d}<span class="tl-s">s</span></button>`).join('');
    bar.addEventListener('click', function(e) {
      const chip = e.target.closest('.tl-chip');
      if (!chip) return;
      buzz();
      bar.querySelectorAll('.tl-chip').forEach(c => c.classList.toggle('active', c === chip));
      if (chip.dataset.decade === '') postState({ filters: {} });
      else postState({ filters: { decade: [parseInt(chip.dataset.decade, 10)] } });
      wakeFromAttract();
    });
  }
  function clearTimelineActive() {
    document.querySelectorAll('#timelineBar .tl-chip').forEach(c => c.classList.toggle('active', c.dataset.decade === ''));
  }

  // ─── Now Showing ───
  let slideAB = true;
  function showOnLayer(p, upgrade) {
    const cur = slideAB ? 'slideA' : 'slideB';
    const prev = slideAB ? 'slideB' : 'slideA';
    slideAB = !slideAB;
    const el = document.getElementById(cur);
    const t = thumbUrl(p);
    if (t) el.style.backgroundImage = `url(${t})`;
    if (p.faceX != null && p.faceY != null) {
      el.style.backgroundPosition = `${p.faceX * 100}% ${p.faceY * 100}%`;
    } else {
      el.style.backgroundPosition = '50% 50%';
    }
    el.classList.add('on');
    document.getElementById(prev).classList.remove('on');
    if (upgrade) {
      const full = fullUrl(p);
      if (full) {
        const img = new Image();
        img.onload = () => { if (el.classList.contains('on')) el.style.backgroundImage = `url(${full})`; };
        img.src = full;
      }
    }
  }

  function updateNowShowing() {
    if (isAttract) return;
    const p = currentPhoto;
    if (!p) return;
    showOnLayer(p, true);
    document.getElementById('detailTitle').textContent = p.title || p.alt || '';
    const meta = [p.year ? `c.${p.year}` : '', p.community || '', p.people || ''].filter(Boolean).join(' · ');
    document.getElementById('detailMeta').textContent = meta;
    document.getElementById('detailDesc').textContent = p.caption || p.description || '';
    document.getElementById('listenBtn').style.display = 'none';
  }

  function updateCount() {
    document.getElementById('countLabel').textContent = `${serverIds.length} photos · ${APP_VERSION}`;
  }

  // ─── Navigation: arrows + swipe ───
  function goTo(offset) {
    const n = serverIds.length;
    if (!n) return;
    const idx = (currentIndex + offset + n) % n;
    jumpTo(idx);
  }
  // Optimistic jump: update the tablet instantly, server confirms on next poll
  function jumpTo(idx) {
    if (idx < 0 || idx >= serverIds.length) return;
    currentIndex = idx;
    currentPhoto = byId[serverIds[idx]] || null;
    updateNowShowing();
    updateGallery();
    postState({ currentIndex: idx });
    wakeFromAttract();
  }
  document.getElementById('btnPrev').addEventListener('click', () => goTo(-1));
  document.getElementById('btnNext').addEventListener('click', () => goTo(1));

  let touchX = null;
  document.getElementById('photoArea').addEventListener('touchstart', function(e) {
    touchX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('photoArea').addEventListener('touchend', function(e) {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 40) {
      swiped = true;
      goTo(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // ─── Tap Now Showing → detail overlay (suppressed after a swipe) ───
  document.getElementById('nowShowing').addEventListener('click', function() {
    if (swiped) { swiped = false; return; }
    if (isAttract) { wakeFromAttract(); return; }
    if (isDetailOpen) return;
    if (!currentPhoto) return;
    openDetail(currentPhoto);
  });

  function openDetail(p) {
    isDetailOpen = true;
    setBgUpgrade(document.getElementById('detailPhoto'), p, true);
    document.getElementById('detailOverlayTitle').textContent = p.title || p.alt || '';
    const meta = [p.year ? `c.${p.year}` : '', p.community || '', p.province || '', p.people || ''].filter(Boolean).join(' · ');
    document.getElementById('detailOverlayMeta').textContent = meta;
    document.getElementById('detailOverlayDesc').textContent = p.caption || p.description || '';
    showRelated(p);
    document.getElementById('detailOverlay').classList.add('open');
  }

  function closeDetail() {
    isDetailOpen = false;
    document.getElementById('detailOverlay').classList.remove('open');
    resetIdle();
  }

  // Dismiss the detail overlay by tapping anywhere on the dark backdrop
  // (the photo + info area) — the CLOSE button is the backup. Taps on the
  // related cards still select, they don't dismiss.
  document.getElementById('detailOverlay').addEventListener('click', function(e) {
    if (!isDetailOpen) return;
    if (e.target.closest('.related-card')) return;
    closeDetail();
  });

  // Swipe down on the overlay to dismiss (feels natural on a tablet).
  let detailSwipeY = null;
  document.getElementById('detailOverlay').addEventListener('touchstart', function(e) {
    detailSwipeY = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById('detailOverlay').addEventListener('touchmove', function(e) {
    if (detailSwipeY == null || !isDetailOpen) return;
    const dy = e.touches[0].clientY - detailSwipeY;
    if (dy > 90) { detailSwipeY = null; closeDetail(); }
  }, { passive: true });

  // ─── Related photos (same people, community, year, or keywords) ───
  // Returns [{ p, score, reasons[] }] — reasons are the human-readable
  // connection labels shown on each card so visitors understand WHY a photo
  // is related (same people / community / year / keyword).
  function computeRelated(p, max) {
    if (!p) return [];
    const people = (p.people || '').split(';').map(s => s.trim().toLowerCase()).filter(Boolean);
    const comm = (p.community || '').toLowerCase();
    const year = p.year ? Math.round(Number(p.year)) : null;
    const kws = (p.keywords || []).map(k => k.toLowerCase());
    const scored = [];
    for (const q of photos) {
      if (q.id === p.id) continue;
      const qp = (q.people || '').split(';').map(s => s.trim().toLowerCase()).filter(Boolean);
      let score = 0;
      const reasons = [];
      // Shared people: strongest signal — find the actual shared name(s)
      if (people.length && qp.length) {
        const shared = people.filter(x => qp.some(y => y.includes(x) || x.includes(y)));
        if (shared.length) { score += 3; reasons.push('Same people'); }
      }
      // Same community
      if (comm && (q.community || '').toLowerCase() === comm) { score += 2; reasons.push('Same community'); }
      // Same year (within ±1 for c. approximations)
      const qy = q.year ? Math.round(Number(q.year)) : null;
      if (year != null && qy != null && Math.abs(qy - year) <= 1) { score += 2; reasons.push('Same year'); }
      // Shared keyword
      if (kws.length && (q.keywords || []).some(k => kws.includes(k.toLowerCase()))) { score += 1; reasons.push('Shared keyword'); }
      if (score > 0) scored.push({ p: q, score, reasons });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, max || 24);
  }

  function showRelated(p) {
    const rel = computeRelated(p, 24);
    const section = document.getElementById('relatedSection');
    if (!rel.length) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    document.getElementById('relatedCount').textContent = `(${rel.length})`;
    document.getElementById('relatedStrip').innerHTML = rel.map(({ p: q, reasons }) => {
      const meta = [q.year ? `c.${q.year}` : '', q.community || ''].filter(Boolean).join(' · ');
      const pos = (q.faceX != null && q.faceY != null) ? `${q.faceX * 100}% ${q.faceY * 100}%` : '50% 50%';
      const reason = reasons.length ? reasons[0] : 'Related';
      return `<div class="related-card" data-id="${q.id}">
        <div class="rc-photo-wrap">
          <div class="rc-badge">${esc(reason)}</div>
          <div class="rc-photo" data-full="${esc(fullUrl(q))}" data-thumb="${esc(thumbUrl(q))}" style="background-image:url('${thumbUrl(q)}');background-position:${pos}"></div>
        </div>
        <div class="rc-info">
          <div class="rc-title">${esc(q.title || q.alt || '')}</div>
          <div class="rc-meta">${meta}</div>
        </div>
      </div>`;
    }).join('');
    // Upgrade each related photo from thumb to full-res after the grid paints
    // (thumb shows instantly, full image sharpens in place — no pixelation)
    document.querySelectorAll('#relatedStrip .rc-photo').forEach(el => {
      const full = el.dataset.full;
      if (!full) return;
      const img = new Image();
      img.onload = () => { el.style.backgroundImage = `url(${full})`; };
      img.src = full;
    });
  }

  document.getElementById('relatedStrip').addEventListener('click', function(e) {
    const item = e.target.closest('.related-card');
    if (!item) return;
    const rel = computeRelated(currentPhoto, 24);
    const ids = [currentPhoto.id].concat(rel.map(r => r.p.id));
    const idx = ids.indexOf(item.dataset.id);
    postState({ photoIds: ids, currentIndex: Math.max(idx, 0) });
    closeDetail();
  });

  document.getElementById('btnRelated').addEventListener('click', function() {
    if (!currentPhoto) return;
    openDetail(currentPhoto);
  });

  // ─── Gallery strip ───
  let userScrolling = false;
  let userScrollTimer = null;
  function updateGallery() {
    const gal = document.getElementById('gallery');
    if (isAttract) {
      if (!gal.classList.contains('hidden')) gal.classList.add('hidden');
      return;
    }
    gal.classList.remove('hidden');
    // When the relay hasn't delivered a photo set yet (or is unreachable),
    // fall back to ALL photos in manifest order so the visitor can still
    // browse the archive; live sync resumes once the relay responds.
    const ids = serverIds.length ? serverIds : photos.map(p => p.id);
    const key = ids.join(',');
    // Full rebuild only when the SET changes (filters/search/related). A pure
    // currentIndex advance must NOT rebuild the strip — it would reset the
    // user's scroll position and yank them back to the active thumb.
    if (key !== lastGalleryKey) {
      lastGalleryKey = key;
      gal.innerHTML = ids.map((id, i) => {
        const p = byId[id];
        if (!p) return '';
        return `<div class="gal-item${i === currentIndex ? ' active' : ''}" data-idx="${i}" style="background-image:url('${thumbUrl(p)}')" aria-label="${esc(p.title || p.alt || '')}"></div>`;
      }).join('');
    }
    // Update active class in place — no innerHTML rebuild on index change
    const items = gal.querySelectorAll('.gal-item');
    items.forEach((it, i) => it.classList.toggle('active', i === currentIndex));
    // NEVER auto-scroll the strip on state updates. If the user has scrolled
    // away, a poll-driven scrollIntoView yanks them back to the active thumb
    // ("rubber-banding"). The strip only scrolls when the user taps a thumb
    // (jumpTo), which sets currentIndex and the tap itself is in view.
    // If the active thumb is off-screen after a FILTER change, snap (not
    // smooth) to it once so the selection is visible; user scrolls override.
    if (key !== lastGalleryKey && !userScrolling) {
      const active = gal.querySelector('.gal-item.active');
      if (active) {
        const rect = active.getBoundingClientRect();
        const cRect = gal.getBoundingClientRect();
        if (rect.left < cRect.left || rect.right > cRect.right) {
          active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
        }
      }
    }
  }

  document.getElementById('gallery').addEventListener('click', function(e) {
    const item = e.target.closest('.gal-item');
    if (!item) return;
    jumpTo(parseInt(item.dataset.idx, 10));
    wakeFromAttract();
  });

  // While the user is dragging/scrolling the strip, don't let slide advances
  // yank it back to the active thumb. Cleared shortly after they stop.
  document.getElementById('gallery').addEventListener('scroll', function() {
    userScrolling = true;
    clearTimeout(userScrollTimer);
    userScrollTimer = setTimeout(function() { userScrolling = false; }, 1200);
  }, { passive: true });

  // ─── Story Piles ───
  function renderPiles() {
    const row = document.getElementById('pilesRow');
    if (themes.length === 0) {
      row.innerHTML = `
        <div class="pile pile-0"><div class="pile-bg"></div>
          <div class="pile-label">Métis Families</div>
          <div class="pile-sub">Generations of family</div>
        </div>
        <div class="pile pile-1"><div class="pile-bg"></div>
          <div class="pile-label">Land &amp; Daily Life</div>
          <div class="pile-sub">Work, school, outdoors</div>
        </div>
        <div class="pile pile-2"><div class="pile-bg"></div>
          <div class="pile-label">Celebrations</div>
          <div class="pile-sub">Gatherings &amp; ceremonies</div>
        </div>`;
      return;
    }
    const reps = [0, Math.floor(photos.length / 3), Math.floor(2 * photos.length / 3)];
    row.innerHTML = themes.map((t, i) => {
      const repPhoto = photos[reps[i % reps.length]];
      const bgUrl = repPhoto ? `url(${thumbUrl(repPhoto)})` : '';
      return `<div class="pile pile-${i % 3}" onclick="selectTheme(${i})">
        <div class="pile-bg" style="background-image:${bgUrl}"></div>
        <div class="pile-label">${esc(t.title)}</div>
        <div class="pile-sub">${esc(t.subtitle || '')}</div>
      </div>`;
    }).join('');
  }

  function selectTheme(idx) {
    const theme = themes[idx];
    if (!theme) return;
    const updates = {};
    if (theme.filters) updates.filters = theme.filters;
    if (theme.speed) updates.speed = theme.speed;
    if (theme.transition) updates.transition = theme.transition;
    if (theme.captionMode != null) updates.captionMode = theme.captionMode;
    postState(updates);
    clearTimelineActive();
    wakeFromAttract();
  }

  // ─── Controls ───
  function togglePlay() {
    playing = !playing;
    document.getElementById('btnPlay').textContent = playing ? '⏸' : '▶';
    postState({ playing });
  }
  function setSpeed(ms) {
    speedMs = ms;
    document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-speed="${ms}"]`).classList.add('active');
    postState({ speed: ms });
  }
  function setTransition(tr) {
    transition = tr;
    document.querySelectorAll('[data-trans]').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-trans="${tr}"]`).classList.add('active');
    postState({ transition: tr });
  }
  function cycleCaptions() {
    captionMode = (captionMode + 1) % 3;
    document.getElementById('btnCaption').classList.toggle('active', captionMode > 0);
    postState({ captionMode });
  }
  function toggleShuffle() {
    shuffle = !shuffle;
    document.getElementById('btnShuffle').classList.toggle('active', shuffle);
    postState({ shuffle });
  }
  function toggleFace() {
    faceTrack = !faceTrack;
    document.getElementById('btnFace').classList.toggle('active', faceTrack);
    postState({ faceTrack });
  }

  // ─── Init ───
  async function init() {
    serverUrl = getServerUrl();

    // Load manifest — try the state relay first, fall back to the SAME-ORIGIN
    // static manifest (mirror the projector). The controller must show the
    // archive even when the relay is unreachable (e.g. GitHub Pages or a
    // mis-routed device); live sync needs the relay, images do not.
    try {
      const r = await fetch(`${serverUrl}/manifest`, { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      photos = d.photos || d;
    } catch (e) {
      try {
        const r = await fetch(`${base()}assets/shoebox/manifest.json`, { signal: AbortSignal.timeout(5000) });
        const d = await r.json();
        photos = d.photos || d;
      } catch (e2) {}
    }
    photos.forEach(p => { byId[p.id] = p; });

    // Load themes
    try {
      const r = await fetch(`${serverUrl}/presets`, { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      themes = d.themes || [];
    } catch (e) {}

    renderPiles();
    buildTimeline();
    enterAttract();          // start screensaver immediately (no black screen, no chrome)
    fetchState();
    startNameCycle();
    startPolling();
    startIdleTimer();

    // Wake on any pointer press (touch, pen, or mouse — touchstart alone
    // misses mouse-driven setups and some browser tap translations). The
    // gesture that dismisses the screensaver must never also press a control
    // underneath: while in attract, EVERY press arms the suppression window,
    // so the click completing the wake gesture is swallowed no matter what it
    // lands on. A separate, deliberate tap is then required to press a
    // button/pile/chip. Any interaction also counts as "alive" so the kiosk
    // watchdog never reloads the page mid-use.
    let suppressClicksUntil = 0;
    function armWake() {
      lastUserActivity = Date.now();
      if (isAttract) suppressClicksUntil = Date.now() + 500;
      wakeFromAttract();
    }
    document.addEventListener('pointerdown', armWake);
    document.addEventListener('touchstart', armWake); // fallback for older engines
    document.addEventListener('click', function(e) {
      if (Date.now() < suppressClicksUntil) {
        suppressClicksUntil = 0;
        e.stopPropagation();
        e.preventDefault();
        if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
        return;
      }
      wakeFromAttract();
    }, true);

    // Kiosk watchdog: if the state feed goes quiet for 12s while the page is
    // visible AND the visitor hasn't touched it, reload. Recovers from wedged
    // timers / suspended tabs so the controller never stays dead on a museum
    // floor — but never yanks the page out from under an active user.
    setInterval(() => {
      if (document.visibilityState === 'visible' &&
          Date.now() - lastStateTime > 12000 &&
          Date.now() - lastUserActivity > 12000) {
        location.reload();
      }
    }, 5000);
  }

  init();
  </script>
</body>
</html>
