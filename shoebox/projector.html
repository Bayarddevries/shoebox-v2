<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shoebox — Projector Slideshow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --near-black: #111;
      --charcoal: #1a1814;
      --warm-gray: #6b655e;
      --light-warm: #cfc8be;
      --cream: #e8e2d6;
      --accent-warm: #bfa885;
      --accent-dark: #8a6f4f;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-kicker: 'Cinzel', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--black); color: var(--cream);
      font-family: var(--font-sans);
    }

    /* �── Fullscreen slideshow layers ─── */
    .slide-stage { position: absolute; inset: 0; pointer-events: none; }
    .slide-layer {
      position: absolute; inset: -4%;
      background-size: cover; background-repeat: no-repeat;
      background-position: 50% 50%;
      filter: brightness(0.75) saturate(1.05);
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Transitions */
    @keyframes kenBurns { from { transform: var(--kb-from); } to { transform: var(--kb-to); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(4%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-4%); } }

    .caption-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 20; pointer-events: none;
      background: linear-gradient(transparent 30%, rgba(10,10,10,0.65) 60%, rgba(10,10,10,0.92));
      padding: 2rem 6vw 1.5rem;
    }
    .caption-overlay .caption-kicker {
      font-family: var(--font-kicker); text-transform: uppercase; letter-spacing: 0.15em;
      font-size: 0.6rem; color: var(--accent-warm); margin-bottom: 0.4rem;
    }
    .caption-overlay .caption-title {
      font-family: var(--font-serif); font-size: 1.8rem; line-height: 1.1;
      color: var(--cream); text-shadow: 0 2px 20px rgba(0,0,0,0.7);
    }
    .caption-overlay .caption-sub {
      font-family: var(--font-sans); font-size: 0.75rem; color: var(--light-warm);
      margin-top: 0.3rem; letter-spacing: 0.02em;
    }

    /* Progress bar */
    .progress-area {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px; z-index: 30;
      background: rgba(255,255,255,0.06); pointer-events: none;
    }
    .progress-fill {
      height: 100%; width: 0%; background: var(--accent-warm);
      transition: width 0.6s ease-out;
    }

    /* Controls panel (slide-out from bottom, auto-hides after 3s mouse idle) */
    #controls {
      position: fixed; inset: auto 2rem 2rem 2rem; z-index: 40;
      background: rgba(10,10,10,0.85); backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 1.25rem 1.5rem;
      display: flex; align-items: stretch; gap: 1rem; flex-wrap: wrap;
      transition: transform 0.35s ease, opacity 0.35s ease;
      transform: translateY(0); opacity: 1;
    }
    .ctrl-group {
      display: flex; flex-direction: column; gap: 0.25rem;
    }
    .ctrl-group .ctrl-label {
      font-family: var(--font-kicker);
      font-size: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--warm-gray);
      line-height: 1;
    }
    .ctrl-btns {
      display: flex; gap: 0.25rem; align-items: center;
    }
    .ctrl-btns button, .ctrl-btns .btn-label {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: var(--cream); padding: 0.4rem 0.6rem; border-radius: 8px;
      font-size: 0.75rem; cursor: pointer; white-space: nowrap;
      font-family: var(--font-sans); letter-spacing: 0.02em;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
    }
    .btn-group button:hover, .btn-group .btn-label.active {
      background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.18);
    }
    .btn-group button.active { background: var(--accent-warm); color: var(--black); border-color: var(--accent-warm); }
    .btn-icon { font-size: 0.65rem; opacity: 0.7; }

    /* Immersive mode — only slide images and captions visible */
    body.immersed #controls,
    body.immersed .progress-area {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity 0.6s ease;
    }
    body.immersed .slide-layer {
      filter: brightness(1) saturate(1.05);
      transition: filter 0.6s ease;
    }

    /* Filter panel (slide-out from left) */
    #filterPanel {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(420px, 95vw); z-index: 50;
      background: rgba(17,16,14,0.96); border-right: 1px solid rgba(255,255,255,0.08);
      padding: 2rem 0 0 0;
      display: flex; flex-direction: column;
      transform: translateX(-105%); transition: transform 0.35s ease;
      backdrop-filter: blur(20px);
    }
    #filterPanel.open { transform: translateX(0); }
    .filter-scroll {
      flex: 1; overflow-y: auto;
      padding: 0 1.5rem 1rem 2rem;
    }
    .filter-actions-sticky {
      flex-shrink: 0;
      padding: 1rem 1.5rem 1.5rem 2rem;
      background: rgba(17,16,14,0.98);
      border-top: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      bottom: 0;
      z-index: 2;
    }
    #filterPanel h3 { font-family: var(--font-kicker); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent-warm); margin: 1.5rem 0 0.5rem; }
    #filterPanel .filter-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; }
    #filterPanel label { color: var(--light-warm); font-size: 0.85rem; cursor: pointer; }

    /* Tag pill display for selected filters */
    #activePills { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.5rem; }
    .pill {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: var(--light-warm); padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem;
    }

    /* Preset selector */
    .preset-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; align-items: center; }
    select { background: var(--near-black); border: 1px solid rgba(255,255,255,0.1); color: var(--cream); padding: 0.35rem 0.5rem; border-radius: 6px; font-size: 0.8rem; }

    /* Info tooltip */
    #infoTip {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
      z-index: 45; pointer-events: none;
      background: rgba(10,10,10,0.82); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 0.3rem 0.9rem; color: var(--light-warm);
      font-size: 0.75rem; opacity: 0; transition: opacity 0.3s; white-space: nowrap;
    }
    #infoTip.show { opacity: 1; }

    /* Exhibit mode — connection status dot */
    #exhibitDot {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 60;
      width: 10px; height: 10px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5);
      transition: background 0.3s, box-shadow 0.3s;
      pointer-events: none;
    }
    #exhibitDot.disconnected { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }
    #exhibitDot.hidden { display: none; }
  </style>
</head>
<body>

  <div id="slide-stage" class="slide-stage">
    <div id="layer-a" class="slide-layer"></div>
    <div id="layer-b" class="slide-layer"></div>
  </div>

  <div class="caption-overlay" id="captionOverlay" style="opacity:0; transition: opacity 0.7s ease; pointer-events:none;">
    <div class="caption-kicker" id="captionKicker"></div>
    <div class="caption-title" id="captionTitle"></div>
    <div class="caption-sub" id="captionSub"></div>
  </div>

  <div class="progress-area"><div class="progress-fill" id="progressFill"></div></div>

  <div id="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Playback</span>
      <div class="ctrl-btns">
        <button onclick="togglePlay()" id="btnPlay" title="Space">⏸</button>
        <button onclick="prevSlide()" title="Left Arrow">◀</button>
        <button onclick="nextSlide()" title="Right Arrow">▶</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Speed</span>
      <div class="ctrl-btns">
        <button onclick="setSpeed(3000)" data-ms="3000">3s</button>
        <button onclick="setSpeed(5000)" data-ms="5000" class="active">5s</button>
        <button onclick="setSpeed(7000)" data-ms="7000">7s</button>
        <button onclick="setSpeed(10000)" data-ms="10000">10s</button>
        <button onclick="setSpeed(15000)" data-ms="15000">15s</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Transition</span>
      <div class="ctrl-btns">
        <button onclick="setTransition('kenburns')" data-tr="kenburns" class="active" title="Ken Burns zoom">Ken</button>
        <button onclick="setTransition('fade')" data-tr="fade" title="Crossfade">Fade</button>
        <button onclick="setTransition('slide')" data-tr="slide" title="Slide left">Slide</button>
        <button onclick="setTransition('cut')" data-tr="cut" title="Instant cut">Cut</button>
        <button onclick="setTransition('wipe')" data-tr="wipe" title="Wipe right">Wipe</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Display</span>
      <div class="ctrl-btns">
        <button onclick="cycleCaptions()" id="btnCaption" title="C">Captions</button>
        <button onclick="toggleShuffle()" id="btnShuffle" title="S">Shuffle</button>
        <button onclick="toggleFaceTrack()" id="btnFace" title="G">Face</button>
        <button onclick="toggleFullscreen()" title="F">Fullscreen</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Filter</span>
      <div class="ctrl-btns">
        <button onclick="toggleFilters()" title="F2">Tags</button>
        <span style="font-size:0.7rem; color: var(--warm-gray);" id="counter">0 / 0</span>
      </div>
    </div>
  </div>

  <!-- Filter Panel -->
  <div id="filterPanel">
    <div class="filter-scroll">
      <h3>Filter Selection</h3>
      <p style="font-size:0.78rem; color: var(--light-warm); margin-bottom: 1rem;">Select categories. Items within a category use OR logic. Active categories combine with AND.</p>

      <h3>Communities</h3>
      <div id="commChecks"></div>

      <h3>Families / People</h3>
      <div id="peopleChecks"></div>

      <h3>Decades</h3>
      <div id="decadeChecks"></div>

      <h3>Keywords</h3>
      <input type="text" id="keywordSearch" placeholder="Search keywords..." style="width:100%; padding:0.4rem; margin-bottom:0.5rem; background:var(--near-black); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:var(--cream); font-family:var(--font-sans); font-size:0.85rem;" oninput="filterKeywordChecks(this.value)">
      <div id="keywordChecks"></div>

      <h3>Presets</h3>
      <div class="preset-row">
        <select id="presetSelect" onchange="loadPreset(this.value)"><option value="">-- Load preset --</option></select>
        <button onclick="savePreset()">Save</button>
      </div>
      <div id="activePills"></div>
    </div>

    <div class="filter-actions-sticky">
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <button onclick="applyFilters()" style="background:var(--accent-warm); color:var(--black); border:none; border-radius:6px; padding:0.4rem 0.8rem; font-family:var(--font-sans); font-size:0.75rem; cursor:pointer;">Apply Filters</button>
        <button onclick="clearFilters()" style="background:rgba(255,255,255,0.06); color:var(--cream); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:0.4rem 0.8rem; font-family:var(--font-sans); font-size:0.75rem; cursor:pointer;">Clear All</button>
        <button onclick="closeFilters()" style="background:rgba(255,255,255,0.06); color:var(--cream); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:0.4rem 0.8rem; font-family:var(--font-sans); font-size:0.75rem; cursor:pointer;">Close</button>
      </div>
    </div>
  </div>

  <div id="infoTip"></div>
  <div id="exhibitDot" class="hidden"></div>

  <script>
  // ─── State ───
  let photos = [], filtered = [], activePhotoIdx = 0, playing = true, speedMs = 5000;
  let transition = 'kenburns';
  let captionMode = 0; // 0=off, 1=title, 2=full
  let shuffle = true;
  let faceTrack = false;
  let timerId = null;
  let activeLayer = 'a';

  // Filters: key = category (community, people, decade, keyword), value = string[] of selected
  let activeFilters = { community: [], people: [], decade: [], keyword: [] };

  // ─── Exhibit mode ───
  const isExhibit = new URLSearchParams(window.location.search).has('exhibit');
  let exhibitServer = null; // set during init
  let lastRemoteState = null;
  let pollTimerId = null;
  let pollFailCount = 0;
  let inLocalFallback = false;

  function getServerUrl() {
    const param = new URLSearchParams(window.location.search).get('server');
    if (param) return `http://${param}`;
    const host = window.location.hostname;
    if (host && host !== 'localhost' && host !== '127.0.0.1' && host !== '') {
      return `http://${host}:8081`;
    }
    return 'http://localhost:8081';
  }

  async function pollExhibitState() {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      const res = await fetch(`${exhibitServer}/state`, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const remote = await res.json();
      pollFailCount = 0;
      if (inLocalFallback) {
        // Server is back: force a full re-apply from remote state
        inLocalFallback = false;
        lastRemoteState = null;
      }
      document.getElementById('exhibitDot').classList.remove('disconnected');
      applyRemoteState(remote);
    } catch (e) {
      pollFailCount++;
      document.getElementById('exhibitDot').classList.add('disconnected');
      if (pollFailCount >= 3) enterLocalFallback();
    }
    pollTimerId = setTimeout(pollExhibitState, 1500);
  }

  // 3 failed polls in a row -> keep the show running locally with all photos.
  // Polling continues underneath, so it reconnects automatically when the
  // server comes back.
  function enterLocalFallback() {
    if (inLocalFallback) return;
    inLocalFallback = true;
    if (photos.length === 0) {
      loadManifest();
      return;
    }
    filtered = photos.slice();
    activePhotoIdx = Math.min(activePhotoIdx, filtered.length - 1);
    loadPhoto(activePhotoIdx);
    if (!timerId && playing && filtered.length > 1) {
      timerId = setTimeout(nextSlide, speedMs);
    }
  }

  function applyRemoteState(remote) {
    const prev = lastRemoteState;
    lastRemoteState = remote;

    // First call — bootstrap from remote state using loaded photos
    if (!prev) {
      if (!photos.length) return; // not ready yet
      applyFiltersFromRemote(remote);
      return;
    }

    // Photo set changed
    const photoIdSet = new Set(remote.photoIds);
    const newFiltered = photos.filter(p => photoIdSet.has(p.id));
    if (newFiltered.length !== filtered.length ||
        (newFiltered.length > 0 && newFiltered[0].id !== filtered[0]?.id)) {
      filtered = newFiltered;
      activePhotoIdx = Math.min(remote.currentIndex || 0, filtered.length - 1);
      if (filtered.length > 0) loadPhoto(activePhotoIdx);
      else document.getElementById('counter').textContent = '0 / 0';
      restartAdvanceTimer();
    }

    // Index changed
    if (prev.currentIndex !== remote.currentIndex && remote.currentIndex != null) {
      const idx = Math.min(remote.currentIndex, filtered.length - 1);
      if (idx >= 0 && idx !== activePhotoIdx) {
        activePhotoIdx = idx;
        if (filtered.length > 0) loadPhoto(activePhotoIdx);
        // Someone commanded a specific photo: give it a full display cycle
        // instead of letting the old countdown skip past it.
        restartAdvanceTimer();
      }
    }

    // Settings
    applySettingsFromRemote(remote);
  }

  // Restart the auto-advance countdown at a full interval. Used after any
  // remote jump so a commanded photo gets its full display time.
  function restartAdvanceTimer() {
    if (timerId) clearTimeout(timerId);
    timerId = null;
    if (playing && filtered.length > 1) {
      timerId = setTimeout(nextSlide, speedMs);
    }
  }

  function applyFiltersFromRemote(remote) {
    const photoIdSet = new Set(remote.photoIds);
    filtered = photos.filter(p => photoIdSet.has(p.id));
    activePhotoIdx = Math.min(remote.currentIndex || 0, filtered.length - 1);
    if (filtered.length > 0) loadPhoto(activePhotoIdx);
    else document.getElementById('counter').textContent = '0 / 0';
    applySettingsFromRemote(remote);
  }

  function applySettingsFromRemote(remote) {
    let changed = false;
    if (remote.speed && remote.speed !== speedMs) {
      speedMs = remote.speed; changed = true;
    }
    if (remote.transition && remote.transition !== transition) {
      transition = remote.transition; changed = true;
    }
    if (remote.captionMode != null && remote.captionMode !== captionMode) {
      captionMode = remote.captionMode; changed = true;
    }
    if (remote.shuffle != null && remote.shuffle !== shuffle) {
      shuffle = remote.shuffle; changed = true;
    }
    if (remote.faceTrack != null && remote.faceTrack !== faceTrack) {
      faceTrack = remote.faceTrack; changed = true;
    }
    if (remote.playing != null && remote.playing !== playing) {
      playing = remote.playing; changed = true;
    }
    // Only restart timer when settings or filtered set actually changed,
    // not on every poll (which would keep resetting the countdown)
    if (changed) {
      if (timerId) clearTimeout(timerId);
      if (playing && filtered.length > 1) {
        timerId = setTimeout(nextSlide, speedMs);
      }
    }
    // Ensure timer exists if playing and nothing changed (first start)
    if (!changed && !timerId && playing && filtered.length > 1) {
      timerId = setTimeout(nextSlide, speedMs);
    }
  }

  function reportIndex(idx) {
    if (!isExhibit || !exhibitServer) return;
    fetch(`${exhibitServer}/state`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentIndex: idx })
    }).catch(() => {});
  }

  // ─── Manifest loader ───
  async function loadManifest() {
    try {
      const base = window.location.pathname.includes('/shoebox-v2/') ? '/shoebox-v2/' : '/';
      const res = await fetch(base + 'assets/shoebox/manifest.json');
      const data = await res.json();
      photos = data.photos || data;
      buildFilters();
      applyFilters();
      nextSlide();
    } catch (e) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter;color:#cfc8be;"><div><h2>Manifest not found</h2><p>Make sure <code>assets/shoebox/manifest.json</code> is available.</p></div></div>';
    }
  }

  // ─── Filter construction ───
  function buildFilters() {
    const communities = new Set();
    const people = new Set();
    const keywords = new Set();
    const decades = new Set();
    photos.forEach(p => {
      if (p.community) communities.add(p.community);
      if (p.people) p.people.split(';').map(s => s.trim()).filter(Boolean).forEach(pn => people.add(pn));
      if (p.keywords) p.keywords.forEach(k => keywords.add(k));
      if (p.year) {
        const y = Math.round(Number(p.year));
        if (y) decades.add(Math.floor(y / 10) * 10);
      }
    });

    const render = (id, set, sortFn) => {
      const sorted = [...set].sort(sortFn || ((a, b) => String(a).localeCompare(String(b))));
      document.getElementById(id).innerHTML = sorted.map(s => {
        return `<label class="filter-row"><input type="checkbox" value="${s}" onchange="toggleCategoryFilter('${id.replace('Checks', '')}', '${s}', this.checked)"> <span>${String(s)}</span></label>`;
      }).join('');
    };

    render('commChecks', communities);
    render('peopleChecks', people);
    render('keywordChecks', keywords, null); // no special sort for keywords initially
    render('decadeChecks', decades, (a, b) => a - b);
  }

  // ─── Filter logic ───
  function toggleCategoryFilter(category, value, checked) {
    const catKey = category.replace('Checks', '');
    // Map 'keywordChecks' -> 'keyword'
    const key = catKey === 'keyword' ? 'keyword' : catKey === 'comm' ? 'community' : catKey === 'people' ? 'people' : catKey;
    if (!activeFilters[key]) activeFilters[key] = [];
    if (checked) {
      if (!activeFilters[key].includes(value)) activeFilters[key].push(value);
    } else {
      activeFilters[key] = activeFilters[key].filter(v => v !== value);
    }
    renderPills();
  }

  function renderPills() {
    const pills = [];
    for (const [key, vals] of Object.entries(activeFilters)) {
      for (const v of vals) pills.push({ cat: key, val: v });
    }
    document.getElementById('activePills').innerHTML = pills.map(p => `<span class="pill">${p.cat}:${p.val}</span>`).join('');
  }

  function applyFilters() {
    const cats = Object.entries(activeFilters);
    filtered = photos.filter(p => {
      // If no filters set, include all
      const hasActive = cats.some(([k, arr]) => arr.length > 0);
      if (!hasActive) return true;

      // Each active category must have at least one match (AND between categories)
      for (const [key, vals] of cats) {
        if (vals.length === 0) continue; // empty category doesn't restrict
        let match = false;
        if (key === 'community') { match = vals.includes(p.community); }
        else if (key === 'people') { const pPeople = (p.people || '').split(';').map(s => s.trim()).filter(Boolean); match = vals.some(v => pPeople.includes(v)); }
        else if (key === 'decade') { match = vals.some(v => Math.round(Number(p.year) / 10) * 10 === Number(v)); }
        else if (key === 'keyword') { const pKw = p.keywords || []; match = vals.some(v => pKw.includes(v)); }
        if (!match) return false; // fails this category
      }
      return true;
    });
    if (shuffle) shuffledFiltered(); else filtered.sort((a, b) => (a.alt || '').localeCompare(b.alt || ''));
    activePhotoIdx = 0;
    document.getElementById('counter').textContent = `1 / ${filtered.length}`;
    setTimeout(() => { if (filtered.length > 0) { loadPhoto(0); } }, 100);
    showInfoTip('Filtered to ' + filtered.length + ' photo' + (filtered.length !== 1 ? 's' : ''));
  }

  function shuffledFiltered() {
    const arr = [...filtered];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    filtered = arr;
  }

  function clearFilters() {
    activeFilters = { community: [], people: [], decade: [], keyword: [] };
    document.querySelectorAll('#filterPanel input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.getElementById('keywordSearch').value = '';
    applyFilters();
  }

  function filterKeywordChecks(query) {
    const q = query.toLowerCase();
    document.querySelectorAll('#keywordChecks label').forEach(label => {
      const text = label.textContent.toLowerCase();
      label.style.display = (!q || text.includes(q)) ? 'block' : 'none';
    });
  }

  // ─── Photo display ───
  function encodePath(p) { return p.split('/').map(s => encodeURIComponent(s)).join('/'); }

  function loadPhoto(idx) {
    if (filtered.length === 0) return;
    activePhotoIdx = idx % filtered.length;
    const photo = filtered[activePhotoIdx];
    const base = window.location.pathname.includes('/shoebox-v2/') ? '/shoebox-v2/' : '/';
    const url = base + encodePath(photo.src);

    // Compute position: center by default, face-aware if tracking is on
    let faceX = 0.5, faceY = 0.5;
    if (faceTrack && photo.faceX != null && photo.faceY != null) {
      faceX = photo.faceX;
      faceY = photo.faceY;
    }

    // Update caption overlay
    if (captionMode === 1 || captionMode === 2) {
      document.getElementById('captionTitle').textContent = photo.title || photo.alt || '';
      let sub = '';
      if (captionMode === 2) {
        sub = [photo.year ? (photo.year < 2000 ? 'c.' + photo.year : 'scanned ' + photo.year) : '', photo.community || '', photo.people ? photo.people.split(';').map(s => s.trim()).slice(0,2).join(', ') : ''].filter(Boolean).join('  ·  ');
      } else {
        if (photo.community || photo.year) sub = [photo.community || '', photo.year ? 'c.' + photo.year : ''].filter(Boolean).join('  ·  ');
      }
      document.getElementById('captionSub').textContent = sub;
      document.getElementById('captionKicker').textContent = 'Shoebox Archive';
      document.getElementById('captionOverlay').style.opacity = '1';
    } else {
      document.getElementById('captionOverlay').style.opacity = '0';
    }

    // Update progress bar
    document.getElementById('progressFill').style.width = ((idx + 1) / filtered.length * 100) + '%';
    document.getElementById('counter').textContent = (idx + 1) + ' / ' + filtered.length;

    // Preload next
    const nextIdx = (idx + 1) % filtered.length;
    if (filtered[nextIdx]) {
      const pre = new Image();
      pre.src = base + encodePath(filtered[nextIdx].src);
    }

    // Apply transition based on transition setting
    applyImageToLayer(url, faceX, faceY, photo, idx);
  }

  function applyImageToLayer(url, faceX, faceY, photo, idx) {
    // Ken Burns always targets the detected face when data exists;
    // faceTrack only controls the static background position
    const kbFaceX = photo && photo.faceX != null ? photo.faceX : null;
    const kbFaceY = photo && photo.faceY != null ? photo.faceY : null;
    const kb = getKenBurns(idx, kbFaceX, kbFaceY);
    const incoming = activeLayer === 'a' ? document.getElementById('layer-b') : document.getElementById('layer-a');
    const outgoing = activeLayer === 'a' ? document.getElementById('layer-a') : document.getElementById('layer-b');

    // Smart background-size: fit height for portrait photos (avoid head cropping),
    // fit width for landscape. Uses manifest width/height if available.
    let bgSize = 'cover';
    if (photo && photo.width && photo.height) {
      const imgAspect = photo.width / photo.height;
      const screenAspect = window.innerWidth / window.innerHeight;
      bgSize = imgAspect < screenAspect ? 'auto 100%' : '100% auto';
    }

    incoming.style.backgroundImage = `url("${url}")`;
    incoming.style.backgroundSize = bgSize;
    incoming.style.backgroundPosition = `${faceX * 100}% ${faceY * 100}%`;
    incoming.style.opacity = '1';
    incoming.style.zIndex = '2';
    incoming.style.animation = 'none';
    // Force reflow
    void incoming.offsetHeight;

    // Set animation based on transition
    if (transition === 'kenburns') {
      incoming.style.setProperty('--kb-from', kb.from);
      incoming.style.setProperty('--kb-to', kb.to);
      incoming.style.animation = `kenBurns ${speedMs + 1500}ms ease-in-out both`;
      incoming.style.transformOrigin = kb.origin || 'center';
    } else if (transition === 'fade') {
      incoming.style.animation = `fadeIn ${speedMs}ms ease-in-out both`;
      incoming.style.transform = 'none';
    } else if (transition === 'slide') {
      incoming.style.animation = `slideIn ${speedMs}ms ease-in-out both`;
      incoming.style.transform = 'translateX(0)';
    } else if (transition === 'cut') {
      incoming.style.animation = 'none';
      incoming.style.opacity = '1';
      incoming.style.transform = 'scale(1)';
    } else if (transition === 'wipe') {
      incoming.style.animation = 'fadeIn 0.8s ease-in-out both';
      incoming.style.clipPath = 'polygon(0 0, 100% 0, 100% 100%, 0 100%)';
      // Simple wipe simulation: fade overlay
    }

    outgoing.style.opacity = '0';
    outgoing.style.zIndex = '1';
    outgoing.style.animation = 'none';

    activeLayer = activeLayer === 'a' ? 'b' : 'a';
  }

  function getKenBurns(idx, faceX, faceY) {
    const scaleTo = 1.15;
    // Face-aware Ken Burns: the zoom is anchored on the face, so it pushes
    // in toward the face or pulls out from it. Alternates every slide.
    if (faceX != null && faceY != null) {
      const ox = Math.max(0, Math.min(100, faceX * 100)).toFixed(1);
      const oy = Math.max(0, Math.min(100, faceY * 100)).toFixed(1);
      const origin = `${ox}% ${oy}%`;
      if (idx % 2 === 0) {
        // Push in: zoom toward the face
        return { from: 'scale(1)', to: `scale(${scaleTo})`, origin };
      } else {
        // Pull out: start tight on the face, reveal the full image
        return { from: `scale(${scaleTo})`, to: 'scale(1)', origin };
      }
    }
    // No face data: gentle random drift, centered
    const kbVariants = [
      { from: 'scale(1)', to: 'scale(1.12) translate(-1.5%, -1%)', origin: 'center' },
      { from: 'scale(1)', to: 'scale(1.12) translate(1.5%, 1%)', origin: 'center' },
      { from: 'scale(1.12) translate(-1%, 1.5%)', to: 'scale(1)', origin: 'center' },
      { from: 'scale(1.12) translate(1%, -1.5%)', to: 'scale(1)', origin: 'center' },
    ];
    return kbVariants[idx % kbVariants.length];
  }

  // ─── Playback controls ───
  function nextSlide() {
    const idx = (activePhotoIdx + 1) % Math.max(filtered.length, 1);
    loadPhoto(idx);
    reportIndex(idx);
    if (playing) { if (timerId) clearTimeout(timerId); timerId = setTimeout(() => { activePhotoIdx = (activePhotoIdx + 1) % Math.max(filtered.length, 1); nextSlide(); }, speedMs); }
  }
  function prevSlide() {
    const idx = (activePhotoIdx - 1 + Math.max(filtered.length, 1)) % Math.max(filtered.length, 1);
    loadPhoto(idx);
    reportIndex(idx);
    if (playing) { if (timerId) clearTimeout(timerId); timerId = setTimeout(() => { activePhotoIdx = (activePhotoIdx + 1) % Math.max(filtered.length, 1); nextSlide(); }, speedMs); }
  }

  function togglePlay() {
    playing = !playing;
    document.getElementById('btnPlay').textContent = playing ? '⏸' : '▶';
    if (playing) { timerId = setTimeout(() => { nextSlide(); updateTimerIdx(); }, speedMs); }
    else { if (timerId) clearTimeout(timerId); }
  }
  function updateTimerIdx() { activePhotoIdx = (activePhotoIdx) % Math.max(filtered.length, 1); }

  function setSpeed(ms) {
    speedMs = ms;
    document.querySelectorAll('#controls button[data-ms]').forEach(b => b.classList.remove('active'));
    document.querySelector('#controls button[data-ms="' + ms + '"]').classList.add('active');
    if (playing) { if (timerId) clearTimeout(timerId); timerId = setTimeout(() => { activePhotoIdx = (activePhotoIdx + 1) % Math.max(filtered.length, 1); nextSlide(); }, speedMs); }
    showInfoTip(ms / 1000 + 's per slide');
  }

  function setTransition(tr) {
    transition = tr;
    document.querySelectorAll('#controls button[data-tr]').forEach(b => b.classList.remove('active'));
    document.querySelector('#controls button[data-tr="' + tr + '"]').classList.add('active');
    showInfoTip('Transition: ' + tr);
  }

  function cycleCaptions() {
    captionMode = (captionMode + 1) % 3;
    const labels = ['Off', 'Title', 'Full'];
    document.getElementById('btnCaption').textContent = 'Captions';
    document.getElementById('btnCaption').classList.toggle('active', captionMode > 0);
    if (filtered.length > 0) loadPhoto(activePhotoIdx);
    showInfoTip('Captions: ' + labels[captionMode]);
  }

  function toggleShuffle() {
    shuffle = !shuffle;
    document.getElementById('btnShuffle').classList.toggle('active', shuffle);
    applyFilters();
    showInfoTip('Shuffle: ' + (shuffle ? 'On' : 'Off'));
  }

  function toggleFaceTrack() {
    faceTrack = !faceTrack;
    document.getElementById('btnFace').classList.toggle('active', faceTrack);
    if (filtered.length > 0) loadPhoto(activePhotoIdx);
    showInfoTip('Face tracking: ' + (faceTrack ? 'On' : 'Off'));
  }

  // ─── Fullscreen ───
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  // ─── Filters panel ───
  function toggleFilters() { document.getElementById('filterPanel').classList.toggle('open'); }
  function closeFilters() { document.getElementById('filterPanel').classList.remove('open'); }

  // ─── Presets ───
  function savePreset() {
    const name = prompt('Preset name:', 'Event ' + new Date().toLocaleDateString());
    if (!name) return;
    const preset = { filters: JSON.parse(JSON.stringify(activeFilters)), transition, speedMs, captionMode, shuffle, faceTrack };
    const all = JSON.parse(localStorage.getItem('shoebox_presets') || '{}');
    all[name] = preset;
    localStorage.setItem('shoebox_presets', JSON.stringify(all));
    refreshPresetSelect();
    showInfoTip('Saved preset: ' + name);
  }
  function loadPreset(name) {
    if (!name) return;
    const all = JSON.parse(localStorage.getItem('shoebox_presets') || '{}');
    const preset = all[name];
    if (!preset) return;
    activeFilters = preset.filters || { community: [], people: [], decade: [], keyword: [] };
    transition = preset.transition || 'kenburns';
    speedMs = preset.speedMs || 5000;
    captionMode = preset.captionMode || 0;
    shuffle = preset.shuffle || false;
    faceTrack = preset.faceTrack || false;
    document.getElementById('btnShuffle').classList.toggle('active', shuffle);
    document.getElementById('btnCaption').classList.toggle('active', captionMode > 0);
    document.getElementById('btnFace').classList.toggle('active', faceTrack);
    document.querySelectorAll('#filterPanel input[type="checkbox"]').forEach(cb => {
      const val = cb.value;
      let found = false;
      for (const [key, vals] of Object.entries(activeFilters)) {
        if (vals.includes(val)) { cb.checked = true; found = true; break; }
      }
      if (!found) cb.checked = false;
    });
    document.getElementById('keywordSearch').value = '';
    applyFilters();
    showInfoTip('Loaded preset: ' + name);
  }
  function refreshPresetSelect() {
    const all = JSON.parse(localStorage.getItem('shoebox_presets') || '{}');
    const sel = document.getElementById('presetSelect');
    const current = sel.value;
    sel.innerHTML = '<option value="">— Load preset —</option>' + Object.keys(all).map(k => `<option value="${k}">${k}</option>`).join('');
    if (current) sel.value = current;
  }

  // ─── Touch & keyboard ───
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowLeft') prevSlide();
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'c' || e.key === 'C') cycleCaptions();
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    if (e.key === 'g' || e.key === 'G') toggleFaceTrack();
    if (e.key === 's' || e.key === 'S') toggleShuffle();
    if (e.key === 'Escape') closeFilters();
    if (e.key === 'F2') toggleFilters();
    if (['1','2','3','4','5'].includes(e.key)) {
      const msMap = { '1': 3000, '2': 5000, '3': 7000, '4': 10000, '5': 15000 };
      if (msMap[e.key]) setSpeed(msMap[e.key]);
    }
    if (e.key === 't' || e.key === 'T') {
      const trOptions = ['kenburns', 'fade', 'slide', 'cut', 'wipe'];
      const idx = trOptions.indexOf(transition);
      const nextTr = trOptions[(idx + 1) % trOptions.length];
      setTransition(nextTr);
    }
  });

  document.addEventListener('touchstart', (e) => {
    // Touch edges: left third = prev, right third = next, center = play/pause
    const x = e.touches[0].clientX;
    const w = window.innerWidth;
    if (x < w * 0.25) prevSlide();
    else if (x > w * 0.75) nextSlide();
    else togglePlay();
  }, { passive: true });

  // Immersive mode — controls, captions, progress fade after 3s idle
  let mouseTimer = null;
  function showUI() {
    document.body.classList.remove('immersed');
    clearTimeout(mouseTimer);
    mouseTimer = setTimeout(() => document.body.classList.add('immersed'), 3000);
  }
  document.addEventListener('mousemove', showUI);
  document.addEventListener('touchstart', showUI);

  // Info tooltip
  let tipTimer = null;
  function showInfoTip(msg) {
    const tip = document.getElementById('infoTip');
    tip.textContent = msg; tip.classList.add('show');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => tip.classList.remove('show'), 2000);
  }

  // Init
  if (isExhibit) {
    exhibitServer = getServerUrl();
    // Hide the control bar in exhibit mode
    document.getElementById('controls').style.display = 'none';
    document.getElementById('exhibitDot').classList.remove('hidden');
    // Load manifest for photo data, then start polling
    fetch(exhibitServer + '/manifest')
      .then(r => r.json())
      .then(data => {
        photos = data.photos || data;
        if (photos.length > 0) {
          // Apply initial state from server
          pollExhibitState();
        }
      })
      .catch(() => {
        document.getElementById('exhibitDot').classList.add('disconnected');
        // Fall back to normal mode
        loadManifest();
      });
  } else {
    refreshPresetSelect();
    document.getElementById('btnShuffle').classList.toggle('active', shuffle);
    loadManifest();
  }

  // Auto-start (only in non-exhibit mode — exhibit mode is driven by polling)
  if (!isExhibit) {
    setTimeout(() => { playing = true; nextSlide(); }, 300);
  }
  </script>
</body>
</html>
