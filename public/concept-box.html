<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red River Métis Shoebox — The Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============================================================
   THE BOX — make the title literal.
   An open shoebox on a warm table, 23 photographs spilling out
   of its mouth in a deliberate diagonal fan. The box is the hero
   object; the prints are objects lying on the surface, never
   cropped (contain, width = height x the photo's own ratio).
   Two ambient motions only: a slow drift of the whole scene
   (box + lid + prints as one group) and a slow breath of light.
   ============================================================ */
:root{
  --ink:#ece1cb;
  --ochre:#c9a05e;
  --quiet:#b3a68f;
  --paper:#efe6d0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ---------- the warm surface: a lit table, not a wall ---------- */
.surface{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(158deg,#33251a 0%,#2a1c10 46%,#1b1209 100%)}
.surface::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(93deg, rgba(255,236,205,0.012) 0 3px, rgba(0,0,0,0.02) 4px 9px),
             repeating-linear-gradient(3deg, rgba(255,236,205,0.008) 0 2px, rgba(0,0,0,0.015) 3px 11px)}
.surface::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(125% 95% at 78% 108%, rgba(0,0,0,0.42) 0%, transparent 55%),
             radial-gradient(120% 90% at 12% -6%, rgba(255,231,190,0.10) 0%, transparent 60%)}
.light{position:absolute;left:-18%;top:-26%;width:120%;height:120%;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 34% 44% at 30% 26%, rgba(255,236,198,0.10) 0%, rgba(255,236,198,0.03) 52%, transparent 76%);
  animation:breath 74s ease-in-out infinite alternate}
@keyframes breath{from{opacity:0.55}to{opacity:0.95}}

/* ---------- the whole scene drifts as one breathing group ---------- */
.scene{position:absolute;inset:0;z-index:3;will-change:transform;
  animation:arrive .8s ease both, drift 104s ease-in-out infinite alternate}
@keyframes arrive{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:translate3d(-5px,2px,0)}to{transform:translate3d(6px,-3px,0)}}

/* ---------- prints ---------- */
.ph{position:absolute;cursor:pointer;background-repeat:no-repeat;
  background-position:center;background-size:contain;
  transition:transform .22s ease;
  transform:rotate(var(--r,0deg))}
.ph:hover{transform:rotate(calc(var(--r,0deg)*0.55)) scale(1.045)}
.ph:active{transform:rotate(calc(var(--r,0deg)*0.55)) scale(0.99)}
.ph.matted{background-color:var(--paper)}
.ph.plain{background-color:#221a12}
.ph.cream{background-color:#f6efdd}

/* ---------- the label system: small, quiet, museum-voice ---------- */
.plabel{position:absolute;pointer-events:none;text-align:left;
  font-family:'EB Garamond',Georgia,serif;line-height:1.18}
.plabel .nm{display:block;font-weight:600;font-variant:small-caps;letter-spacing:0.09em;
  font-size:clamp(0.72rem,1.05vw,0.95rem);color:var(--ink)}
.plabel .yr{display:block;font-variant:small-caps;text-transform:uppercase;font-weight:400;
  font-size:0.78em;letter-spacing:0.16em;color:var(--ochre);margin-top:0.25em}
.plabel.small .nm{font-size:clamp(0.62rem,0.88vw,0.8rem);color:#d9ccb2}
.plabel.small .yr{font-size:0.78em;color:#b09874}

/* ---------- the box: a pure-CSS open shoebox in 3D ---------- */
.boxwrap{position:absolute;inset:0;perspective:1150px;z-index:30}
.box3d{position:absolute;transform-style:preserve-3d;
  transform:rotateX(21deg) rotateY(-25deg)}
.bx{position:absolute}
.bx-front{background:linear-gradient(180deg,#c19463 0%,#b58555 55%,#a17649 100%);
  border-radius:2px 2px 7px 7px}
.bx-front::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(180deg,rgba(255,226,180,0.35),rgba(0,0,0,0.12))}
.bx-front::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(0deg,rgba(60,30,8,0.30),transparent)}
.bx-back{background:linear-gradient(180deg,#6b4a2b,#59391f)}
.bx-right{background:linear-gradient(180deg,#9c6f42,#83572f)}
.bx-left{background:linear-gradient(180deg,#8f6439,#794f2a)}
.bx-bot{background:radial-gradient(130% 110% at 50% 30%, #3a2110 0%, #241104 78%)}
.bx-inner{background:linear-gradient(0deg, rgba(12,4,0,0.62) 0%, rgba(12,4,0,0.10) 55%, rgba(12,4,0,0.55) 100%)}
/* the archive label worn on the front of the box */
.bx-label{position:absolute;background:#dcc79c;border:1px solid rgba(90,58,26,0.55);
  transform:rotate(-4deg);border-radius:1px;text-align:center;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,240,210,0.35), 0 1px 2px rgba(60,30,8,0.35)}
.bx-label .t{display:block;font-family:'EB Garamond',Georgia,serif;font-variant:small-caps;
  font-weight:600;letter-spacing:0.3em;color:#6b4a26;line-height:1}
.bx-label .r{display:block;height:1px;margin:3px auto 0;background:rgba(107,74,38,0.45)}
.mx{position:absolute;width:2px;height:2px;left:50%;top:0;margin-left:-1px}
/* soft cast shadow under the box on the table */
.bshadow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.22) 55%, transparent 78%);
  transform:rotate(-4deg)}

/* ---------- the lid, leaning against the box ---------- */
.lid{position:absolute;pointer-events:none;z-index:31;background:linear-gradient(158deg,#ecdfc0 0%,#ddcda6 70%,#cfbc92 100%);
  border:1px solid rgba(96,66,30,0.35);border-radius:3px;transform-origin:50% 100%;
  box-shadow:inset 0 0 0 1px rgba(255,250,235,0.4), inset 2px 2px 6px rgba(255,250,235,0.5),
             0 14px 26px rgba(0,0,0,0.4)}
.lid .scuff{position:absolute;inset:10px 14px;border:1px solid rgba(96,66,30,0.14);border-radius:2px}
.lid .stamp{position:absolute;left:16px;top:18px;width:52%;height:22%;border:1px solid rgba(96,66,30,0.35);
  transform:rotate(-2deg);background:rgba(107,74,38,0.05);border-radius:1px}

/* ---------- type: flush-left on the left margin, never centered ---------- */
.brand{position:absolute;top:3.6vh;left:0;z-index:5;pointer-events:none;text-align:left}
.brand .wm{font-family:'Cinzel',Georgia,serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(0.98rem,1.36vw,1.2rem);letter-spacing:0.17em;color:var(--ink);line-height:1}
.brand .rule{width:clamp(2.6rem,4.2vw,3.9rem);height:1px;margin-top:0.8rem;
  background:linear-gradient(90deg,rgba(201,160,94,0.9),rgba(201,160,94,0.08))}
.cue{position:absolute;bottom:3.4vh;left:0;z-index:5;pointer-events:none;text-align:left;
  display:flex;flex-direction:column;gap:0.55rem}
.cue .main{display:flex;align-items:center;gap:0.8rem;
  font-family:'Inter',system-ui,sans-serif;font-weight:500;letter-spacing:0.10em;
  text-transform:uppercase;font-size:clamp(0.98rem,1.42vw,1.24rem);color:var(--ochre)}
.cue .main::before{content:'';width:2px;height:1.05em;background:var(--ochre)}
.cue .sub{font-family:'EB Garamond',Georgia,serif;font-size:clamp(0.8rem,1.06vw,0.96rem);
  color:#b6aa94;letter-spacing:0.01em}
.cue .sub b{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-style:normal;
  color:var(--paper);font-size:1.2em;letter-spacing:0.02em}
</style>
</head>
<body>
<div class="surface">
  <div class="light"></div>

  <div class="scene" id="scene">
    <div class="cascade" id="cascade"></div>
    <div class="boxwrap" id="boxwrap">
      <div class="box3d" id="box3d"></div>
    </div>
    <div class="lid" id="lid"></div>
  </div>

  <header class="brand" id="brand">
    <div class="wm">The Red River Métis Shoebox</div>
    <div class="rule"></div>
  </header>
  <footer class="cue" id="cue">
    <div class="main">Touch a photograph to explore</div>
    <div class="sub"><b>544 photographs</b> from families, communities, and stories</div>
  </footer>
</div>
<script>
/* ============================================================
   A tipped-open box. Photographs leave the mouth in a deliberate
   fan: small and tucked at the box, larger and more overlapped as
   they travel out toward the foreground. Every size is computed,
   nothing is scattered.
   ============================================================ */
const SEED = 20260911;
const HERO_ID = 'photo_958ed6c172';            // Germain Mercredi, 1896
const MID_IDS = ['photo_80694aa8e0',           // Mabel Cousineau, Prince Albert
                 'photo_0d22520b08',           // Gordon Starmer, Winnipeg
                 'photo_0b88bd158f'];          // Marie Madeleine Mercredi Lafferty, Fort Chipewyan
/* cascade order: 0 = first out of the box, 13 = hero at the front */
const FAN_IDS = ['photo_3219d51450','photo_7d24d6ef17','photo_2c58e1d54b','photo_0d59c8fd15',
                 'photo_80694aa8e0','photo_4880cb8d29','photo_e2fc8e0341','photo_0d22520b08',
                 'photo_f1d889d41b','photo_64cde9c93d','photo_0b88bd158f','photo_bb13740372',
                 'photo_b5561c1a5b','photo_958ed6c172'];
const EMERGING_IDS = ['photo_66e3eeb4f2','photo_74082c91d8','photo_df9998f18e','photo_2a5fb18da9'];
const TUCKED_IDS   = ['photo_54c9573328','photo_7d8be4b0f5','photo_c21c116cfc'];
const PEEK_IDS     = ['photo_7374d7d3ef','photo_7a7ebdfe0c'];

const thumb = p => encodeURI((p.src||'').replace(/photos\//,'thumbs/').replace(/\.[a-zA-Z0-9]+$/,'.jpg'));
const ratio = p => (p.w && p.h) ? Math.min(Math.max(p.w/p.h, 0.55), 2.1) : 1.4;
const person = p => ((p.people||'').split(';')[0]||'').trim() || (p.title||'');
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RNG = mulberry32(SEED);
const jitter = amt => (RNG()*2-1)*amt;

const loadOk = p => new Promise(res=>{const i=new Image();
  i.onload=()=>res(true);i.onerror=()=>res(false);i.src=thumb(p)});

let POOL=[], BOX=null;
const cascadeEl=document.getElementById('cascade');
const boxEl=document.getElementById('box3d');
const lidEl=document.getElementById('lid');
const wrapEl=document.getElementById('boxwrap');

function setBox(){
  const VW=innerWidth, VH=innerHeight;
  const W=VW*0.235, D=VW*0.185, H=VW*0.165;
  const left=VW*0.145 - W/2, top=VH*0.885 - H;
  const c=`position:absolute;left:${left}px;top:${top}px;width:${W}px;height:${H}px;`;
  const face=(cls,w,h,tf)=>`<div class="bx ${cls}" style="${c}width:${w}px;height:${h}px;margin-left:${-w/2}px;margin-top:${-h/2}px;transform:${tf}"></div>`;
  boxEl.style.cssText=`left:${left}px;top:${top}px;width:${W}px;height:${H}px;`;
  boxEl.innerHTML=
    face('bx-front',W,H,`translateZ(${D/2}px)`) +
    face('bx-back', W,H,`translateZ(${-D/2}px) rotateY(180deg)`) +
    face('bx-right',D,H,`rotateY(90deg) translateZ(${W/2}px)`) +
    face('bx-left', D,H,`rotateY(-90deg) translateZ(${W/2}px)`) +
    face('bx-bot',  W,D,`translateY(${H/2}px) rotateX(90deg)`) +
    face('bx-inner',W,D,`translateY(2px) rotateX(90deg)`) +
    `<div class="bx-label" style="left:${W*0.68}px;top:${H*0.36}px;width:${W*0.27}px;height:${H*0.30}px;padding-top:${H*0.075}px">
       <span class="t">Photographs</span><span class="r" style="width:${W*0.13}px"></span>
     </div>` +
    `<div class="mx" id="mxFront" style="transform:translateZ(${D/2}px)"></div>` +
    `<div class="mx" id="mxBack" style="transform:translateZ(${-D/2}px)"></div>`;
  // lid leaning against the box front, bottom edge on the table
  const LW=W*0.66, LH=H*0.74, lbx=left+W*0.14, lby=top+H+8;
  lidEl.style.cssText=`left:${lbx}px;top:${lby}px;width:${LW}px;height:${LH}px;transform:rotate(15deg)`;
  // cast shadow under the box
  const sh=document.createElement('div');
  sh.className='bshadow';
  sh.style.cssText=`left:${left+W*0.42}px;top:${top+H*0.97}px;width:${W*1.35}px;height:${H*0.34}px`;
  sh.style.zIndex='1';
  const old=document.getElementById('bsh'); if(old) old.remove();
  sh.id='bsh'; cascadeEl.appendChild(sh);
}

function placePrints(list){
  const VW=innerWidth, VH=innerHeight;
  const fr=document.getElementById('mxFront').getBoundingClientRect();
  const br=document.getElementById('mxBack').getBoundingClientRect();
  const M={x:fr.left+fr.width/2, y:fr.top+fr.height/2};
  const B={x:br.left+br.width/2, y:br.top+br.height/2};
  const vh=h=>VH*h/100, vw=w=>VW*w/100;
  const html=[];
  const slot=(p,h,px,py,rot,z,mode,extra)=>{
    const r=ratio(p), pad=(mode==='matted')? (4+RNG()*3) : (mode==='cream'? 12:0);
    const Wd=h*r+pad*2, Hd=h+pad*2;
    const extraStyle=(extra&&extra.style)? ';'+extra.style : '';
    const div=`<div class="ph ${mode}" data-id="${esc(p.id)}" role="img" aria-label="${esc(p.title)}"
      data-ratio="${r.toFixed(4)}" data-w="${Wd.toFixed(1)}" data-h="${Hd.toFixed(1)}"
      title="${esc(p.title)}" style="left:${px}px;top:${py}px;width:${Wd.toFixed(1)}px;height:${Hd.toFixed(1)}px;
        padding:${pad}px;z-index:${z};--r:${rot.toFixed(2)}deg;background-image:url('${thumb(p)}')${extraStyle}">${extra&&extra.html||''}</div>`;
    return {div, p, h, x:px, y:py, w:Wd, hh:Hd, z};
  };
  const push=s=>html.push(s.div);
  // pad mode map: mostly thin cream borders, a couple borderless, one wide mat
  const padMode=i=> (i%6===2)? 'plain' : (i===11? 'cream' : 'matted');

  // 1) tucked deep in the mouth (small, dimmed, cut by the front wall)
  [0.32,0.52,0.74].forEach((t,i)=>{
    const p=list.tucked[i], h=vh(8.6);
    const x=B.x+(M.x-B.x)*t + jitter(6), y=B.y+(M.y-B.y)*t + jitter(4) - h*0.18;
    push(slot(p,h,x,y,jitter(10),2+i,'matted',{style:'filter:brightness(0.8)'}));
  });
  // 2) emerging from the mouth, bottoms tucked behind the front wall
  list.emerging.forEach((p,i)=>{
    const h=vh(10+i*1.1);
    const x=M.x+vw(1.2)+i*vw(2.3)+jitter(8), y=M.y - h*0.30 + i*vh(0.6) + jitter(3);
    push(slot(p,h,x,y,-6+i*3.4+jitter(2),5+i,padMode(i)));
  });
  // 3) the fan: out across the table, growing toward the foreground
  const fan=list.fan;
  fan.forEach((p,k)=>{
    const t=k/(fan.length-1);
    const ang=(-6 + t*16)*Math.PI/180;
    const d=vw(0.13+0.38*t);
    const h=vh(13 + Math.pow(t,1.2)*17);
    const x=M.x+d*Math.cos(ang), y=M.y+d*Math.sin(ang);
    const rot=-7+t*9+jitter(1.1);
    push(slot(p,h,x,y,rot,10+k,padMode(k)));
  });
  // 4) two buried prints peeking from under the front cluster
  list.peek.forEach((p,i)=>{
    const t=0.70+i*0.12, ang=(-6+t*16)*Math.PI/180, d=vw(0.13+0.38*t);
    const h=vh(15.5+i*1.0);
    const x=M.x+d*Math.cos(ang)+jitter(14), y=M.y+d*Math.sin(ang)+jitter(8);
    push(slot(p,h,x,y,jitter(6),11+i,padMode(4+i)));
  });

  cascadeEl.innerHTML=html.map(h=>h.div).join('');

  // labels: hero (name + year) and a few mids (name — community), only where clear
  const rects=()=>[...cascadeEl.querySelectorAll('.ph')].map(el=>({
    x:parseFloat(el.style.left), y:parseFloat(el.style.top),
    w:parseFloat(el.style.width), h:parseFloat(el.style.height)}));
  const clearAt=(x,y,w,h,ex)=>{const r=rects();
    for(let i=0;i<r.length;i++){ if(i===ex) continue;
      if(x<r[i].x+r[i].w+7 && x+w+7>r[i].x && y<r[i].y+r[i].h+7 && y+h+7>r[i].y) return false;}
    return true;};
  const addLabel=(el,p,big,x,y)=>{
    const nm=esc(person(p));
    const comm=p.community? esc(p.community) : '';
    const yr=p.year? esc(p.year) : '';
    const lab=document.createElement('div');
    lab.className='plabel'+(big?'':' small');
    lab.style.left=x+'px'; lab.style.top=y+'px';
    lab.innerHTML=big
      ? `<span class="nm">${nm}</span><span class="yr">${yr}</span>`
      : `<span class="nm">${nm}${comm? ' · '+comm:''}${yr&&!comm? ' · '+yr:''}</span>`;
    el.appendChild(lab);
    return lab;
  };
  const phEls=[...cascadeEl.querySelectorAll('.ph')];
  const byId=id=>phEls.find(el=>el.dataset.id===id);
  const heroEl=byId(HERO_ID);
  if(heroEl){
    const hx=parseFloat(heroEl.style.left), hy=parseFloat(heroEl.style.top)+parseFloat(heroEl.style.height);
    const labW=vw(26), labH=vh(7.2);
    if(clearAt(hx,hy+12,labW,labH,phEls.indexOf(heroEl))){
      addLabel(cascadeEl, fan[fan.length-1], true, hx, hy+12);
    }
  }
  let labeled=0;
  MID_IDS.forEach(id=>{
    if(labeled>=3) return;
    const el=byId(id); if(!el) return;
    const x=parseFloat(el.style.left), y=parseFloat(el.style.top)+parseFloat(el.style.height);
    const labW=vw(24), labH=vh(4.6);
    if(clearAt(x,y+10,labW,labH,phEls.indexOf(el))){
      addLabel(cascadeEl, POOL.find(p=>p.id===id), false, x, y+10);
      labeled++;
    }
  });
  window.__boxStats={
    total:document.querySelectorAll('.ph').length,
    hero:(POOL.find(p=>p.id===HERO_ID)||{}).title,
    heroLabeled:!!byId(HERO_ID)&&!!cascadeEl.querySelector('.plabel'),
    midsLabeled:labeled,
    mouth:{fx:Math.round(M.x),fy:Math.round(M.y),bx:Math.round(B.x),by:Math.round(B.y)},
    viewport:{w:innerWidth,h:innerHeight}
  };
}

function build(list){
  const VW=innerWidth, VH=innerHeight;
  const mx=Math.max(24, VW*0.026);
  document.getElementById('brand').style.left=mx+'px';
  document.getElementById('cue').style.left=mx+'px';
  setBox();
  placePrints(list);
}

fetch('hero-pool.json').then(r=>r.json()).then(async d=>{
  const pool=d.photos||[];
  if(!pool.length) throw new Error('empty pool');
  POOL=pool;
  const byId=id=>pool.find(p=>p.id===id);
  const pick=ids=>ids.map(byId).filter(Boolean);
  const all=[...FAN_IDS,...EMERGING_IDS,...TUCKED_IDS,...PEEK_IDS];
  const wanted=pick(all);
  const ok=[]; for(const p of wanted){ if(await loadOk(p)) ok.push(p); }
  if(ok.length<all.length){
    const cand=pool.filter(p=>p.h>p.w*1.02 && p.faceX!=null && person(p) && !ok.includes(p) && (p.year||0)<=1965);
    for(const p of cand){ if(ok.length>=all.length) break; if(await loadOk(p)) ok.push(p); }
  }
  const got=new Set(ok.map(p=>p.id));
  const get=(ids,def)=>{const g=pick(ids).filter(p=>got.has(p.id));
    while(g.length<def){const p=ok.find(q=>!g.includes(q)); if(!p) break; g.push(p);} return g;};
  const list={
    tucked:get(TUCKED_IDS,3),
    emerging:get(EMERGING_IDS,4),
    fan:get(FAN_IDS,14),
    peek:get(PEEK_IDS,2)
  };
  build(list);
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>build(list),150);});
}).catch(()=>{
  cascadeEl.innerHTML='<div class="plabel" style="left:40px;top:200px;max-width:60vw">Photographs could not be loaded — please check the server.</div>';
});
</script>
</body>
</html>
